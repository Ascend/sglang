name: Build and Push Development Docker Images

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'tag_suffix,for example:B021,release20260203'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    strategy:
      matrix:
        cann_version: ["9.0.0"]
        device_type: ["a3", "910b"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate full image tag
        run: |
          echo "FULL_TAG=cann${{ matrix.cann_version }}-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix }}" >> $GITHUB_ENV  

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang
          tags: ${{ env.FULL_TAG }}

      - name: Log into docker hub
        uses: docker/login-action@v3
        if: ${{ github.repository == 'Ascend/sglang' }}
        with:
          registry: swr.cn-southwest-2.myhuaweicloud.com
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      # Enable Docker multi-architecture build environment
      # Emulate non-native architectures
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # Required for building and pushing multi-arch Docker images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/npu1.Dockerfile
          platforms: linux/arm64, linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: ${{ github.repository == 'Ascend/sglang' && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          # Keep in sync with the manifest job's build_args below, otherwise the
          # dashboard reports args this image was not actually built with.
          build-args: |
            SGLANG_KERNEL_NPU_TAG=2026.08.21
            CANN_VERSION=${{ matrix.cann_version }}
            DEVICE_TYPE=${{ matrix.device_type }}

  # Record the image dependency manifest (pip packages, sglang commit, ...)
  # into a JSON artifact by inspecting the freshly built & pushed image.
  manifest:
    needs: build
    if: ${{ github.repository == 'Ascend/sglang' }}
    uses: ./.github/workflows/generate-image-manifest.yml
    secrets: inherit
    concurrency:
      group: manifest-deploy
      cancel-in-progress: false
    strategy:
      matrix:
        cann_version: ["9.0.0"]
        device_type: ["a3", "910b"]
    with:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann${{ matrix.cann_version }}-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix }}
      dockerfile: docker/npu1.Dockerfile
      # Same block as the build job's build-args above.
      build_args: |
        SGLANG_KERNEL_NPU_TAG=2026.08.21
        CANN_VERSION=${{ matrix.cann_version }}
        DEVICE_TYPE=${{ matrix.device_type }}
      artifact_name: image-manifest-cann${{ matrix.cann_version }}-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix }}
      deploy_pages: 'true'