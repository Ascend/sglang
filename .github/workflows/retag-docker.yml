name: Build and Push CANNBot Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cannbot-image
  cancel-in-progress: false

env:
  SWR_REGISTRY: "swr.cn-southwest-2.myhuaweicloud.com"
  IMAGE: "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann/cann"
  FINAL_TAG: "9.2.0-a3-ubuntu22.04-py3.12"
  DOCKERFILE: "docker/Dockerfile"

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: false

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Build architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/${{ matrix.platform }}

          # 临时 tag:
          # 9.2.0-950-ubuntu22.04-py3.12-amd64
          # 9.2.0-950-ubuntu22.04-py3.12-arm64
          tags: ${{ env.IMAGE }}:${{ env.FINAL_TAG }}-${{ matrix.platform }}

          # 按现有 SWR 流水线格式推送
          outputs: type=registry,oci-mediatypes=false

          pull: true
          provenance: false
          sbom: false

  merge:
    name: merge multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Merge amd64 and arm64
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "${IMAGE}:${FINAL_TAG}" \
            "${IMAGE}:${FINAL_TAG}-amd64" \
            "${IMAGE}:${FINAL_TAG}-arm64"

      - name: Verify final manifest
        run: |
          docker buildx imagetools inspect "${IMAGE}:${FINAL_TAG}"
