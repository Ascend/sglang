name: Build and Push CANNBot Kernel Images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cannbot-image
  cancel-in-progress: false

env:
  SWR_REGISTRY: "swr.cn-southwest-2.myhuaweicloud.com"
  IMAGE: "swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann/cann"
  DOCKERFILE: "docker/Dockerfile"
  OS: "ubuntu22.04"
  PYTHON_VERSION: "py3.12"
  MEMFABRIC_VERSION: "1.5.0.dev20261124"

jobs:
  build:
    name: build kernel-${{ matrix.cann_version }}-${{ matrix.device_label }}-${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cann_version: ["9.1.0", "9.2.0"]
        device_label: [a3, a5]
        platform: [amd64, arm64]

    env:
      # A5 对外标签使用 a5，但基础镜像中的实际 DEVICE_TYPE 是 950。
      BASE_DEVICE: ${{ matrix.device_label == 'a5' && '950' || 'a3' }}
      IMAGE_TAG: kernel-${{ matrix.cann_version }}-${{ matrix.device_label }}-ubuntu22.04-py3.12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: false

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Build architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/${{ matrix.platform }}

          # 单架构临时标签：
          # kernel-9.1.0-a5-ubuntu22.04-py3.12-amd64
          # kernel-9.1.0-a5-ubuntu22.04-py3.12-arm64
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.platform }}

          outputs: type=registry,oci-mediatypes=false

          pull: true
          provenance: false
          sbom: false

          build-args: |
            CANN_VERSION=${{ matrix.cann_version }}
            DEVICE_TYPE=${{ env.BASE_DEVICE }}
            OS=${{ env.OS }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            MEMFABRIC_VERSION=${{ env.MEMFABRIC_VERSION }}

  merge:
    name: merge kernel-${{ matrix.cann_version }}-${{ matrix.device_label }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cann_version: ["9.1.0", "9.2.0"]
        device_label: [a3, a5]

    env:
      IMAGE_TAG: kernel-${{ matrix.cann_version }}-${{ matrix.device_label }}-ubuntu22.04-py3.12

    steps:
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Merge amd64 and arm64
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            -t "${IMAGE}:${IMAGE_TAG}" \
            "${IMAGE}:${IMAGE_TAG}-amd64" \
            "${IMAGE}:${IMAGE_TAG}-arm64"

      - name: Verify final manifest
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
