name: Coverage Rate Test (NPU)
on:
  pull_request:
    branches:
      - main
      - testcases-260813
    paths:
      - ".github/workflows/coverage-rate-test-npu.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      job_filter:
        description: 'Select which job to run (leave empty or "all" to run all jobs)'
        required: false
        type: string
        default: 'all'
      image_a2:
        description: 'The a2 running docker image of the test task.'
        required: false
        type: string
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-910b'
      image_a3:
        description: 'The a3 running docker image of the test task.'
        required: false
        type: string
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3'
      skip_install_flag:
        description: 'Indicates whether to skip the installation of sglang, defaulting to false.'
        required: false
        type: string
        default: 'true'
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      job_filter:
        description: 'Select which job to run (leave empty or "all" to run all jobs)'
        required: false
        type: string
        default: 'all'
      image_a2:
        description: 'The a2 running docker image of the test task.'
        required: false
        type: string
        default: ''
      image_a3:
        description: 'The a3 running docker image of the test task.'
        required: false
        type: string
        default: ''
      skip_install_flag:
        description: 'Indicates whether to skip the installation of sglang, defaulting to false.'
        required: false
        type: string
        default: ''
concurrency:
  group: nightly-test-npu-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}
jobs:
  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.set-vars.outputs.ref }}
      job_filter: ${{ steps.set-vars.outputs.job_filter }}
      image_a2: ${{ steps.set-vars.outputs.image_a2 }}
      image_a3: ${{ steps.set-vars.outputs.image_a3 }}
      skip_install_flag: ${{ steps.set-vars.outputs.skip_install_flag }}
      run_start_metadata: ${{ steps.set-vars.outputs.run_start_metadata }}
    steps:
      # When triggered by PR, no inputs parameters are used. The latest community code is tested by default.
      - name: Set image config
        id: set-vars
        env:
          # Pass untrusted PR metadata through environment variables to avoid shell‑script interpolation,
          # mitigating script injection risks from fork branch names.
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
        run: |
          if [ -z "${{ inputs.ref }}" ]; then
            echo "ref=" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          fi
          if [ -z "${{ inputs.job_filter }}" ]; then
            echo "job_filter=all" >> $GITHUB_OUTPUT
          else
            echo "job_filter=${{ inputs.job_filter }}" >> $GITHUB_OUTPUT
          fi
          if [ -z "${{ inputs.image_a2 }}" ]; then
            echo "image_a2=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-910b" >> $GITHUB_OUTPUT
          else
            echo "image_a2=${{ inputs.image_a2 }}" >> $GITHUB_OUTPUT
          fi
          if [ -z "${{ inputs.image_a3 }}" ]; then
            echo "image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3" >> $GITHUB_OUTPUT
          else
            echo "image_a3=${{ inputs.image_a3 }}" >> $GITHUB_OUTPUT
          fi
          if [ -z "${{ inputs.skip_install_flag }}" ]; then
            echo "skip_install_flag=false" >> $GITHUB_OUTPUT
          else
            echo "skip_install_flag=${{ inputs.skip_install_flag }}" >> $GITHUB_OUTPUT
          fi
          # If the nightly pipeline is triggered by a PR, this variable takes the source branch label of the PR;
          # otherwise, it uses the branch or tag name of the current ref.
          BRANCH_LABEL="$HEAD_LABEL"
          if [ -z "${BRANCH_LABEL}" ]; then
            BRANCH_LABEL="${{ github.ref_name }}"
          fi
          BRANCH_LABEL="$(echo "${BRANCH_LABEL}" | tr -cd 'a-zA-Z0-9._/:' | tr '/:' '--')"
          # Package run metadata (branch/workflow/create_time) as a single JSON for reuse by all
          # test jobs; create_time is UTC+8 date + time (minute precision) recorded once at run
          # start, shared even across midnight.
          RUN_START_METADATA="$(python3 -c "import json,sys; print(json.dumps({'branch_label':sys.argv[1],'workflow_name':sys.argv[2],'create_time':sys.argv[3]}))" "$BRANCH_LABEL" "${{ github.workflow }}" "$(date -u -d '+8 hours' +%Y%m%d-%H%M)")"
          # Write to GITHUB_OUTPUT and print to the log in one command.
          echo "run_start_metadata=${RUN_START_METADATA}" | tee -a $GITHUB_OUTPUT

  base-b-test-1-npu-a3:
    needs: [ set-image-config ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: base-b-test-1-npu-a3
      runner_config: linux-aarch64-a3-2-
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      run_timeout_minutes: '60'
      timeout_per_file: '3600'
      use_coverage_runner: false
      is_nightly_pipeline_job: true
      upload_test_logs: true
    secrets: inherit

  base-b-test-2-npu-a3:
    needs: [ set-image-config ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: base-b-test-2-npu-a3
      runner_config: linux-aarch64-a3-2-
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      run_timeout_minutes: '120'
      timeout_per_file: '3600'
      use_coverage_runner: false
      is_nightly_pipeline_job: true
      upload_test_logs: true
    secrets: inherit

  # ==================== Recommend Tests from Coverage ==================== #
  # Downloads the pre-built coverage baseline (test_case_map.json + covstub)
  # from OBS and runs test_selector.py to recommend affected test cases for
  # the current PR. continue-on-error: true so it never blocks the PR gate.
  recommend-tests-from-coverage:
    name: Recommend tests from coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    outputs:
      coverage_paths: ${{ steps.export-paths.outputs.coverage_paths }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout sglang scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Download test case map
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://sglang-ascend.obs.cn-east-3.myhuaweicloud.com/test_case_map.json" \
            -o test_case_map.json
          test -s test_case_map.json
          echo "Downloaded test_case_map.json"
          du -h test_case_map.json

      - name: Download coverage package and extract covstub
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://sglang-ascend.obs.cn-east-3.myhuaweicloud.com/outputs.tar.gz" \
            -o outputs.tar.gz
          test -s outputs.tar.gz
          echo "Downloaded outputs.tar.gz"
          du -h outputs.tar.gz
          tar xzf outputs.tar.gz outputs/covstub
          test -d outputs/covstub
          echo "Extracted outputs/covstub"
          find outputs/covstub -maxdepth 2 -type d | head -20 || true

      - name: Recommend tests for current PR
        run: |
          set -euo pipefail
          if ! python3 -c "import regex" >/dev/null 2>&1; then
            echo "regex not found for $(python3 -V); bootstrapping pip and installing regex"
            curl -fsSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py --break-system-packages
            python3 -m pip install --break-system-packages regex
          fi
          python3 -c "import regex; print('regex ok:', regex.__file__)"
          PR_SPEC="${{ github.repository }}#${{ github.event.pull_request.number }}"
          echo "Selecting tests for PR: ${PR_SPEC}"
          # test_selector.py resolves relative paths against the script's own dir,
          # so pass absolute paths for files downloaded to the workspace root.
          python3 scripts/ci/npu/precise-test/test_selector.py \
            --github-pr "${PR_SPEC}" \
            --source-dir "$PWD/outputs/covstub" \
            --map-file "$PWD/test_case_map.json"

      - name: Export coverage paths output
        id: export-paths
        if: always()
        run: |
          FILE="scripts/ci/npu/precise-test/recommended_pytest_paths.txt"
          if [ -f "$FILE" ]; then
            {
              echo "coverage_paths<<EOF"
              cat "$FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Exported $(wc -l < "$FILE") recommended paths"
          else
            echo "coverage_paths=" >> "$GITHUB_OUTPUT"
            echo "::notice::recommended_pytest_paths.txt not found"
          fi

  # ==================== Analyze Failure Report ==================== #
  # Runs after all test jobs and the coverage-based test recommender.
  # Calls the reusable failure-analysis workflow to collect logs, cross-
  # reference them with the recommended test paths, and produce a report.
  # if: always() so it runs even when tests fail (which is the whole point).
  analyze-failure-report:
    name: Analyze failure report
    needs:
      [
        base-b-test-1-npu-a3,
        base-b-test-2-npu-a3,
        recommend-tests-from-coverage,
      ]
    if: always()
    uses: ./.github/workflows/_analyze_failure.yaml
    with:
      log_artifact_pattern: selected-test-logs-*
      recommendations_file: recommended_pytest_paths.txt
      recommendations_content: ${{ needs.recommend-tests-from-coverage.outputs.coverage_paths || '' }}

  pr-test-npu-finish:
    needs:
      [
        base-b-test-1-npu-a3,
        base-b-test-2-npu-a3,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          # Convert the 'needs' context to a JSON string
          json_needs='${{ toJson(needs) }}'

          # Get a list of all job names from the JSON keys
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')

          for job in $job_names; do
            # For each job, extract its result
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')

            # Print the job name and its result
            echo "$job: $result"

            # Check for failure or cancellation and exit if found
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          # If the loop completes, all jobs were successful
          echo "All jobs completed successfully"
          exit 0
