  full-poc-multi-node-tests:
    name: multi-node-poc
    needs: [ set-image-config ]
    # TEMP SMOKE: disabled; only the mix glm5_1 multi-node case runs.
    if: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          # glm5.2 performance tests
          - name: glm_5_2_w4a8_4p1d_48p_in128k_out1k_prefix90_50ms
