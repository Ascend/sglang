name: Full Test (NPU)

on:
  pull_request:
    branches:
      - testcases-261015
    paths:
      - ".github/workflows/full-test-npu.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      job_filter:
        description: 'Select which job to run (leave empty or "all" to run all jobs)'
        required: false
        type: string
        default: 'all'
      image_a3:
        description: 'The a3 running docker image of the test task. Must be an image with sglang preinstalled (e.g. lmsysorg/sglang:*a3*).'
        required: false
        type: string
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-B010'
      coverage_mode:
        description: 'Run in coverage mode: full and nightly basic-function/accuracy suites collect coverage (per-job artifacts); perf and multi-node suites run normally.'
        required: false
        type: boolean
        default: true

concurrency:
  group: full-test-npu-${{ inputs.coverage_mode == true && 'coverage-' || '' }}${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.set-vars.outputs.ref }}
      job_filter: ${{ steps.set-vars.outputs.job_filter }}
      image_a3: ${{ steps.set-vars.outputs.image_a3 }}
      coverage_mode: ${{ steps.set-vars.outputs.coverage_mode }}
    steps:
      # When triggered by PR, no inputs parameters are used. The latest community code is tested by default.
      - name: Set image config
        id: set-vars
        run: |
          if [ -z "${{ inputs.ref }}" ]; then
            echo "ref=" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.job_filter }}" ]; then
            echo "job_filter=all" >> $GITHUB_OUTPUT
          else
            echo "job_filter=${{ inputs.job_filter }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.image_a3 }}" ]; then
            echo "image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-B010" >> $GITHUB_OUTPUT
          else
            echo "image_a3=${{ inputs.image_a3 }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.coverage_mode }}" ]; then
            echo "coverage_mode=true" >> $GITHUB_OUTPUT
          else
            echo "coverage_mode=${{ inputs.coverage_mode }}" >> $GITHUB_OUTPUT
          fi

  nighly-test-npu:
    needs: [set-image-config]
    name: nightly-test-npu
    # Coverage mode: nested nightly collects coverage for its basic-function
    # and accuracy suites only.
    if: ${{ (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    uses: ./.github/workflows/nightly-test-npu.yml
    with:
      ref:  ${{ needs.set-image-config.outputs.ref }}
      job_filter: ${{ needs.set-image-config.outputs.job_filter }}
      image_a3: ${{ needs.set-image-config.outputs.image_a3 }}
      coverage_mode: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
    secrets: inherit

  full-1-npu-a3:
    name: full-1-npu-a3
    if: ${{ (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: full-1-npu-a3
      runner_config: linux-aarch64-a3-2
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      # Coverage mode: 2x timeout budget.
      run_timeout_minutes: ${{ needs.set-image-config.outputs.coverage_mode == 'true' && '960' || '480' }}
      timeout_per_file: '7200'
      partitions: '{"size":5,"arr":[0,1,2,3,4]}'
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      use_coverage_runner: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
      upload_coverage_artifact: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
    secrets: inherit

  full-2-npu-a3:
    name: full-2-npu-a3
    if: ${{ (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: full-2-npu-a3
      runner_config: linux-aarch64-a3-2
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      # Coverage mode: 2x timeout budget.
      run_timeout_minutes: ${{ needs.set-image-config.outputs.coverage_mode == 'true' && '960' || '480' }}
      timeout_per_file: '7200'
      partitions: '{"size":4,"arr":[0,1,2,3]}'
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      use_coverage_runner: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
      upload_coverage_artifact: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
    secrets: inherit

  full-4-npu-a3:
    name: full-4-npu-a3
    if: ${{ (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-pr-test-stage.yml
