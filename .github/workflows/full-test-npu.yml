#    secrets: inherit

  full-1-npu-a3:
    name: full-1-npu-a3
    if: ${{ !cancelled() }}
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: full-1-npu-a3
      runner_config: linux-aarch64-a3-2-
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      # Coverage mode: 2x budget (tracing overhead, no per-file timeout backstop).
      run_timeout_minutes: ${{ needs.set-image-config.outputs.coverage_mode == 'true' && '960' || '480' }}
      timeout_per_file: '7200'
      partitions: '{"size":5,"arr":[0,1,2,3,4]}'
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      use_coverage_runner: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
      upload_coverage_artifact: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
      upload_image_source: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
    secrets: inherit

