name: Full Test (NPU)

on:
  pull_request:
    branches:
      - main
      - testcases
    paths:
      - ".github/workflows/full-test-npu.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      image_a2:
        description: 'The a2 running docker image of the test task.'
        required: false
        type: string
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-910b'
      image_a3:
        description: 'The a3 running docker image of the test task.'
        required: false
        type: string
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3'
      skip_install_flag:
        description: 'Indicates whether to skip the installation of sglang, defaulting to false.'
        required: false
        type: string
        default: ''

concurrency:
  group: full-test-npu-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.set-vars.outputs.ref }}
      image_a2: ${{ steps.set-vars.outputs.image_a2 }}
      image_a3: ${{ steps.set-vars.outputs.image_a3 }}
      skip_install_flag: ${{ steps.set-vars.outputs.skip_install_flag }}
    steps:
      - name: Set image config
        id: set-vars
        run: |
          echo "========== INPUT PARAMETERS =========="
          echo "inputs.ref            = ${{ inputs.ref }}"
          echo "inputs.image_a2       = ${{ inputs.image_a2 }}"
          echo "inputs.image_a3       = ${{ inputs.image_a3 }}"
          echo "inputs.skip_install_flag = ${{ inputs.skip_install_flag }}"
          echo "======================================="
          if [ -z "${{ inputs.ref }}" ]; then
            echo "ref=" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.image_a2 }}" ]; then
            echo "image_a2=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-910b" >> $GITHUB_OUTPUT
          else
            echo "image_a2=${{ inputs.image_a2 }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.image_a3 }}" ]; then
            echo "image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3" >> $GITHUB_OUTPUT
          else
            echo "image_a3=${{ inputs.image_a3 }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.skip_install_flag }}" ]; then
            echo "skip_install_flag=true" >> $GITHUB_OUTPUT
          else
            echo "skip_install_flag=${{ inputs.skip_install_flag }}" >> $GITHUB_OUTPUT
          fi

  full-1-npu-a3:
    needs: [ set-image-config ]
    runs-on: linux-aarch64-a3-2-
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    container:
      image: ${{ needs.set-image-config.outputs.image_a3 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-image-config.outputs.ref || github.ref }}
      - name: Install dependencies
        env:
          TORCH_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
          PYPI_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
          UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
          GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
        run: |
          # speed up by using infra cache services
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host "${CACHING_URL}"
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          if [ ${{ needs.set-image-config.outputs.skip_install_flag }} != "true" ];then
            bash scripts/ci/npu/npu_ci_install_dependency.sh a3
          else
            sglang_pkg_path=/sgl-workspace/sglang/python
            ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
            mkdir -p ${ascend_test_util_path}
            mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
            cp -r ${sglang_source_path}/python/sglang/test/ascend ${ascend_test_util_path}
          fi

          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp
          cp ~/.cache/modelscope/hub/datasets/hellaswag_val.jsonl /tmp
      - name: Print Log Information
        run: bash scripts/ci/npu/npu_log_print.sh
      - name: Run test
        timeout-minutes: 960
        env:
          SGLANG_USE_MODELSCOPE: true
          SGLANG_IS_IN_CI: true
          HF_ENDPOINT: https://hf-mirror.com
          TORCH_EXTENSIONS_DIR: /tmp/torch_extensions
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          STREAMS_PER_DEVICE: 32
          TRANSFORMERS_VERBOSITY: "error"
          GDN_ATTN_BACKEND_TRITON: 1
        run: |
          # speed up by using infra cache services
          pip install sglang_router
          hf download lmms-lab/MMMU --repo-type dataset
          pip install fastokens
          pip install mindstudio-probe --pre
          pip install sentence_transformers torchaudio==2.10.0
          pip install zss pre-commit wandb>=0.16.0 tenacity==8.3.0 loguru openpyxl latex2sympy2 zstandard transformers-stream-generator tqdm-multiprocess pycocoevalcap
          pip install yt-dlp sentencepiece==0.1.99 nltk av ftfy sqlitedict==2.1.0 sacrebleu>=1.5.0 pytablewriter black==24.1.0 isort==5.13.2 peft>=0.2.0 accelerate>=0.29.1
          pip install jsonlines httpx==0.25.0 evaluate>=0.4.0 datasets==2.16.1 numexpr xgrammar==0.2.1 numpy==1.26.4 dotenv granian
          pip install opentelemetry-sdk opentelemetry-api opentelemetry-exporter-otlp opentelemetry-exporter-otlp-proto-grpc
          pip install msgpack
          pip install watchfiles
          pip install torchao==0.16.0
          pip install /root/.cache/.cache/npu-pkgs/torch_memory_saver-0.0.8-cp311-cp311-linux_aarch64.whl
          git clone --branch v0.3.3 --depth 1 https://github.com/EvolvingLMMs-Lab/lmms-eval.git
          cd ./lmms-eval
          nohup pip install . > lmmslog.txt 2>&1 &
          sleep 120
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          cd ../
          cd test
          # Only run the selected test files for this suite via --files.
          # suite/nightly filtering is bypassed when --files is provided.
          python3 run_suite.py --hw npu --suite full-1-npu-a3 --nightly --continue-on-error --timeout-per-file 4800 --auto-partition-size 2 --auto-partition-id ${{ matrix.part }} --files "test/registered/ascend/basic_function/lora/test_npu_lora_backend.py,test/registered/ascend/basic_function/model_tokenizer/test_npu_model_tokenizer_multimodal.py,test/registered/ascend/basic_function/speculative_inference/test_npu_adaptive_speculative.py,test/registered/ascend/llm_models/test_npu_llama_2_7b.py,test/registered/ascend/basic_function/lora/test_npu_lora_overlap_loading.py,test/registered/ascend/basic_function/lora/test_npu_lora_qwen3.py,test/registered/ascend/basic_function/openai_server/test_npu_serving_transcription.py,test/registered/ascend/basic_function/api_related/test_npu_api_related_tool_call.py,test/registered/ascend/basic_function/lora/test_npu_wait_threshold.py,test/registered/ascend/basic_function/sessions/test_npu_streaming_session.py,test/registered/ascend/basic_function/lora/test_npu_lora_radix_cache.py"

