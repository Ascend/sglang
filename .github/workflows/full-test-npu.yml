  full-poc-multi-node-mix-tests:
    name: multi-node-mix-poc
    if: ${{ always() && needs.set-image-config.result == 'success' && (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          # glm5_3 accuracy tests
          - name: glm_5_3_w8a8_16p_gpqa
            node_size: 2
            test_case: test/registered/npu/accuracy/glm5_3/test_npu_glm_5_3_w8a8_16p_gpqa.py
            test_type: 'accuracy'
          - name: glm_5_3_w8a8_32p_in128k_out1k_prefix90_20ms
            node_size: 4
            test_case: test/registered/npu/accuracy/glm5_3/test_npu_glm_5_3_w8a8_32p_in128k_out1k_prefix90_20ms.py
            test_type: 'perf'
          # kimi_k3 mix tests
          - name: kimi_k3_w4a8_32p_gpqa
            node_size: 4
            test_case: test/registered/npu/accuracy/kimi_k3/test_npu_kimi_k3_w4a8_32p_gpqa.py
            test_type: 'accuracy'
          - name: kimi_k3_w4a8_32p_mix_in16k_out1k
            node_size: 4
            test_case: test/registered/npu/performance/kimi_k3/test_npu_kimi_k3_w4a8_32p_mix_in16k_out1k.py
            test_type: 'perf'
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type || 'perf' }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: 'mix'
      transformers_version: ''

  full-poc-multi-node-mix-tests-mix:
    name: multi-node-mix-poc
    if: ${{ always() && needs.set-image-config.result == 'success' && (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          # glm5_3 accuracy tests
          - name: glm_5_3_w8a8_16p_gpqa_mix
            node_size: 2
            test_case: test/registered/npu/accuracy/glm5_3/test_npu_glm_5_3_w8a8_16p_gpqa_mix.py
            test_type: 'accuracy'
          - name: glm_5_3_w8a8_32p_in128k_out1k_prefix90_20ms_mix
            node_size: 4
            test_case: test/registered/npu/accuracy/glm5_3/test_npu_glm_5_3_w8a8_32p_in128k_out1k_prefix90_20ms_mix.py
            test_type: 'perf'
          # kimi_k3 mix tests
          - name: kimi_k3_w4a8_32p_gpqa_mix
            node_size: 4
            test_case: test/registered/npu/accuracy/kimi_k3/test_npu_kimi_k3_w4a8_32p_gpqa_mix.py
            test_type: 'accuracy'
          - name: kimi_k3_w4a8_32p_mix_in16k_out1k_mix
            node_size: 4
            test_case: test/registered/npu/performance/kimi_k3/test_npu_kimi_k3_w4a8_32p_mix_in16k_out1k_mix.py
            test_type: 'perf'
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type || 'perf' }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: 'mix'
      transformers_version: ''