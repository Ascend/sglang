  # ==================== Coverage Assembly & Publish (coverage mode) ==================== #
  # Assembles the full-suite coverage data collected by the coverage jobs.
  # The traced code is the image's preinstalled sglang, so the covstub
  # baseline is that source too: full-1-npu-a3 partition 0 stages
  # /sgl-workspace/sglang/python/sglang as a tarball inside its covdata
  # artifact (upload_image_source), and the steps below unpack it.
  # Transport: the runner pool mixes 800t and 560t machines (two separate
  # shared disks), so each partition job stages its data in a job-private
  # dir and ships a covdata-* artifact; the download step below merges
  # everything back into the canonical RUN_DIR/outputs layout, keeping the
  # assembly steps transport-agnostic. This workflow's perf/multi-node
  # suites run without coverage (per requirement) and are not in needs; the
  # nested nightly workflow IS in needs — in coverage mode it skips its own
  # perf/multi-node jobs, so waiting on it waits only on coverage producers.
  # !cancelled() (not success(), not !failure()): a failed test job must not
  # block the report — failed tests' coverage still counts (their per-test
  # dirs carry FAILED markers).
  setup-covstub:
    needs:
      [
        set-image-config,
#        nighly-test-npu,
        full-1-npu-a3,
        full-2-npu-a3,
        full-4-npu-a3,
        full-8-npu-a3,
        full-16-npu-a3,
#        full-acc-2-npu-a3,
#        full-acc-4-npu-a3,
#        full-acc-16-npu-a3,
      ]
    if: ${{ !cancelled() && (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') && needs.set-image-config.outputs.coverage_mode == 'true' }}
    runs-on: linux-amd64-cpu-4
    container:
      image: swr.ap-southeast-1.myhuaweicloud.com/base_image/ascend-ci/sglang:main-x86
    steps:
      - name: Collect coverage data from partition jobs
        # covdata-* zip root is outputs/ contents (sglang@<tag>/...); pointing
        # the download at RUN_DIR/outputs restores the shared-disk layout.
        # Per-test dirs from the partitions coalesce; coverage files never
        # collide (host.pid.random suffixes). The full-1-p0 artifact also
        # carries sglang-image-src.tar.gz (the traced source, staged via
        # upload_image_source) at the outputs/ root.
        uses: actions/download-artifact@v4
        with:
          pattern: covdata-*
          merge-multiple: true
          path: /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/outputs/

      - name: Unpack image source to covstub
        # The traced code is the image's preinstalled sglang, so the covstub
        # baseline must be that exact source. The ref checkout does NOT
        # qualify: full-test pairs an arbitrary ref with an arbitrary image,
        # and a mismatched baseline silently misattributes line data. No
        # fallback — fail loudly and recover from the covdata artifacts.
        run: |
          set -euo pipefail
          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          COVSTUB="${RUN_DIR}/outputs/covstub"
          mkdir -p "${COVSTUB}"
          # full-1-p0's covdata upload is continue-on-error, so the source
          # tarball can be silently absent.
          if [ ! -f "${RUN_DIR}/outputs/sglang-image-src.tar.gz" ]; then
            echo "::error::sglang-image-src.tar.gz missing from covdata artifacts (full-1-npu-a3 p0 upload failed?). The covdata-* artifacts remain on the run page; re-stage the image source and rebuild the report manually."
            exit 1
          fi
          tar -xzf "${RUN_DIR}/outputs/sglang-image-src.tar.gz" -C "${COVSTUB}"
          # The image may lack _version.py (build-generated); the placeholder
          # keeps coverage html from failing on a missing recorded source file.
          [ -f "${COVSTUB}/sglang/_version.py" ] \
            || echo '__version__ = "0.0.0"' > "${COVSTUB}/sglang/_version.py"

      - name: Generate HTML coverage report
        # Best-effort add-on: continue-on-error keeps the job green and later
        # steps running, while a failed generation still shows a red ✗ in the UI.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          # Date tag derivation must match run_tests_with_coverage.sh.
          if [ -n "${GITHUB_RUN_STARTED_AT:-}" ]; then
            COV_DATE_TAG="${GITHUB_RUN_STARTED_AT:0:10}"
            COV_DATE_TAG="${COV_DATE_TAG//-/}"
          else
            COV_DATE_TAG="$(date +%Y%m%d)"
          fi
          COV_ROOT="${RUN_DIR}/outputs/sglang@${COV_DATE_TAG}"
          COVSTUB="${RUN_DIR}/outputs/covstub"
          # Standalone top-level dir, packaged into htmlcov.tar.gz at publish.
          REPORT_DIR="${RUN_DIR}/htmlcov"

          # No data -> nothing to report.
          if [ ! -d "${COV_ROOT}" ] \
            || [ "$(find "${COV_ROOT}" -name 'coverage.*' -type f | wc -l)" -eq 0 ]; then
            echo "::warning::No coverage data found, skip HTML report"
            exit 0
          fi

          # Pin matches the test jobs' coverage==7.8.* so combine can read
          # their SQLite data.
          if ! python3 -c "import coverage" 2>/dev/null; then
            python3 -m pip install coverage==7.8.* \
              -i http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
              --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
              --retries 3 --timeout 60 \
              || python3 -m pip install coverage==7.8.* -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
          fi

          # Alias runner-specific source paths onto covstub; first entry must
          # be a real local path (no wildcards).
          {
            echo "[run]"
            echo "branch = True"
            echo "[paths]"
            echo "sglang ="
            echo "    ${COVSTUB}/sglang/"
            echo "    */python/sglang/"
          } > /tmp/report-rc

          # --keep preserves the per-test raw coverage files: coverage-data.tar.gz
          # archives them after this step for manual report rebuilds.
          COVERAGE_FILE=/tmp/.coverage-all \
            python3 -m coverage combine --rcfile=/tmp/report-rc --keep \
            $(find "${COV_ROOT}" -name 'coverage.*' -type f)

          rm -rf "${REPORT_DIR}"
          COVERAGE_FILE=/tmp/.coverage-all \
            python3 -m coverage html --rcfile=/tmp/report-rc \
            --directory="${REPORT_DIR}"

          # NPU-only view: [run] source does not filter at report time (a
          # source-based rcfile yields the full report), so instead touch the
          # unexecuted npu .py files into a data copy (os.walk, so the PEP 420
          # namespace tree counts) and filter with --include, which works.
          cp /tmp/.coverage-all /tmp/.coverage-npu
          python3 - "${COVSTUB}" <<'PYEOF'
          import os
          import sys
          from coverage import CoverageData

          npu_root = os.path.join(sys.argv[1], "sglang", "srt", "hardware_backend", "npu")
          data = CoverageData(basename="/tmp/.coverage-npu")
          data.read()
          measured = set(data.measured_files())
          added = 0
          for root, _, files in os.walk(npu_root):
              for f in files:
                  if f.endswith(".py"):
                      p = os.path.join(root, f)
                      if p not in measured:
                          data.touch_file(p)
                          added += 1
          data.write()
          print(f"NPU view: {len(measured)} measured, touched {added} unexecuted files")
          PYEOF
          rm -rf "${REPORT_DIR}-npu"
          COVERAGE_FILE=/tmp/.coverage-npu \
            python3 -m coverage html --rcfile=/tmp/report-rc \
            --include='*/sglang/srt/hardware_backend/npu/*' \
            --directory="${REPORT_DIR}-npu"

          # Surface the totals directly on the run page.
          # GITHUB_STEP_SUMMARY may be unset on the k8s runner pool.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Full-Test Coverage"
              echo '```'
              echo "python/sglang (measured files only):"
              COVERAGE_FILE=/tmp/.coverage-all \
                python3 -m coverage report --rcfile=/tmp/report-rc | tail -n 1
              echo "python/sglang/srt/hardware_backend/npu (full-tree denominator):"
              COVERAGE_FILE=/tmp/.coverage-npu \
                python3 -m coverage report --rcfile=/tmp/report-rc \
                --include='*/sglang/srt/hardware_backend/npu/*' | tail -n 1
              echo '```'
              echo "Full line-by-line report: download the \`coverage-html-report\` artifact and open \`htmlcov/index.html\` (NPU-only view: \`htmlcov-npu/index.html\`)."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "HTML coverage report: ${REPORT_DIR}"
          echo "NPU-only HTML coverage report: ${REPORT_DIR}-npu"

      - name: Upload HTML coverage report
        # Report upload must never block the publish pipeline.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          # Two paths -> artifact root becomes the run dir, so the archive
          # holds htmlcov/ and htmlcov-npu/ side by side.
          path: |
            /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/htmlcov
            /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/htmlcov-npu
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive outputs
        run: |
          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          # Source-only package: report rebuilds need covstub only, and it
          # shrinks the bulk from ~300MB to a few MB.
          tar -czf "${RUN_DIR}/outputs.tar.gz" -C "${RUN_DIR}" outputs/covstub
          # Raw coverage data for manual report rebuilds: extract both archives
          # under one root to reconstruct outputs/. Absent when no data.
          # Date tag derivation must match run_tests_with_coverage.sh.
          if [ -n "${GITHUB_RUN_STARTED_AT:-}" ]; then
            COV_DATE_TAG="${GITHUB_RUN_STARTED_AT:0:10}"
            COV_DATE_TAG="${COV_DATE_TAG//-/}"
          else
            COV_DATE_TAG="$(date +%Y%m%d)"
          fi
          if [ -d "${RUN_DIR}/outputs/sglang@${COV_DATE_TAG}" ]; then
            tar -czf "${RUN_DIR}/coverage-data.tar.gz" -C "${RUN_DIR}" "outputs/sglang@${COV_DATE_TAG}"
          fi

      - name: Upload outputs
        # Never blocks the publish pipeline; must run before publish mv's
        # the files to the fixed PUBLISH_DIR (races with concurrent runs).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: precise-test-outputs
          path: /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/outputs.tar.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload raw coverage data
        # Separate artifact keeps the ~300MB bulk out of the baseline package;
        # must run before publish mv's the file to the fixed PUBLISH_DIR.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: precise-test-coverage-data
          path: /root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}/coverage-data.tar.gz
          # Absent when this run collected no coverage data.
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish outputs to shared disk
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          # Fixed-name copy for manual use. Distinct from pr-test-npu.yml's
          # "coverage" dir on purpose: the full-suite data must NOT overwrite
          # the PR recommendation baseline.
          PUBLISH_DIR="/root/.cache/tests/precise-test/coverage-full"

          # Skip publish when no coverage data this run — never publish an
          # incomplete package. coverage-data.tar.gz (raw data) and htmlcov
          # (report) are both absent only when nothing was collected.
          if [ ! -f "${RUN_DIR}/coverage-data.tar.gz" ] && [ ! -d "${RUN_DIR}/htmlcov" ]; then
            echo "::warning::no coverage data this run, skip publish"
            exit 0
          fi

          mkdir -p "${PUBLISH_DIR}"

          # Same-filesystem mv is atomic per file, so readers never see a
          # partial file (files from two concurrent publishes can interleave).
          mv "${RUN_DIR}/outputs.tar.gz" "${PUBLISH_DIR}/outputs.tar.gz"
          if [ -f "${RUN_DIR}/coverage-data.tar.gz" ]; then
            mv "${RUN_DIR}/coverage-data.tar.gz" "${PUBLISH_DIR}/coverage-data.tar.gz"
          fi

          # HTML reports too, fixed names — latest wins, like the baseline.
          # [ -d ] guards the continue-on-error generation step. A tar failure
          # aborts red after the baseline mv completed; Cleanup stays skipped,
          # keeping RUN_DIR for recovery.
          if [ -d "${RUN_DIR}/htmlcov" ]; then
            tar -czf "${PUBLISH_DIR}/htmlcov.tar.gz" -C "${RUN_DIR}" htmlcov
          fi
          if [ -d "${RUN_DIR}/htmlcov-npu" ]; then
            tar -czf "${PUBLISH_DIR}/htmlcov-npu.tar.gz" -C "${RUN_DIR}" htmlcov-npu
          fi

          echo "Published full-test coverage to ${PUBLISH_DIR}"
          ls -lh "${PUBLISH_DIR}" | tail -n +2

      - name: Clean up per-run directory
        # Skipped on publish failure, keeping RUN_DIR for manual recovery.
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="/root/.cache/tests/precise-test/${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          rm -rf "${RUN_DIR}"
          echo "Removed ${RUN_DIR}"

  check-all-jobs:
    if: github.repository == 'sgl-project/sglang' && always()
    needs:
#      - nighly-test-npu
      - full-1-npu-a3
      - full-2-npu-a3
      - full-4-npu-a3
      - full-8-npu-a3
      - full-16-npu-a3
#      - full-acc-2-npu-a3
#      - full-acc-4-npu-a3
#      - full-acc-16-npu-a3
#      - full-perf-2-npu-a3
#      - full-perf-4-npu-a3
#      - full-perf-8-npu-a3
#      - full-perf-16-npu-a3
#      - full-poc-multi-node-tests
#      - full-poc-multi-node-mix-tests
      - setup-covstub
    runs-on: ubuntu-latest
    container:
      image: docker.m.daocloud.io/ubuntu:22.04
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more nightly test jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more nightly test jobs were cancelled"
            exit 1
          fi
          echo "All nightly test jobs passed"
