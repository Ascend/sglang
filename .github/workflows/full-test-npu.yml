name: Full Test (NPU)

# TEMP (validation only): this branch rewrites full-test into the SR1/SR2/SR3
# validation set. It is not intended to merge.
on:
  pull_request:
    branches:
      - testcases-261015
    paths:
      - ".github/workflows/full-test-npu.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''

concurrency:
  group: full-test-npu-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.set-vars.outputs.ref }}
      image_a3: ${{ steps.set-vars.outputs.image_a3 }}
      run_start_metadata: ${{ steps.set-vars.outputs.run_start_metadata }}
    steps:
      - name: Set image config
        id: set-vars
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "${{ inputs.ref }}" ]; then
            echo "ref=" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          fi
          echo "image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.2.0-a3-B050" >> $GITHUB_OUTPUT
          BRANCH_LABEL="${HEAD_REF}"
          BRANCH_LABEL="$(echo "${BRANCH_LABEL}" | tr -cd 'a-zA-Z0-9._/:' | tr '/:' '--')"
          CREATE_TIME="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          echo "run_start_metadata={\"branch_label\":\"${BRANCH_LABEL}\",\"workflow_name\":\"${{ github.workflow }}\",\"create_time\":\"${CREATE_TIME}\"}" >> $GITHUB_OUTPUT

  # SR1/SR2: DSV4-Flash A3 16P accuracy (prefill graph on).
  sr1-acc-16-npu-a3:
    name: sr1-acc-16-npu-a3
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-single-node-test-stage.yml
    with:
      runner: linux-aarch64-a3-16
      test_type: accuracy
      test_suite: nightly-acc-16-npu-a3
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      only_tests: |
        test/registered/npu/accuracy/deepseek_v4_flash/test_npu_deepseek_v4_flash_w8a8_8p_gpqa.py
      run_start_metadata: ${{ needs.set-image-config.outputs.run_start_metadata }}
    secrets: inherit

  # SR1: pure-prefill benchmark, 8P (TP8/DP8 -> 1024 token/rank).
  sr1-perf-8-npu-a3:
    name: sr1-perf-8-npu-a3
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-single-node-test-stage.yml
    with:
      runner: linux-aarch64-a3-800t-8
      test_type: perf
      test_suite: full-perf-8-npu-a3
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      only_tests: |
        test/registered/npu/performance/deepseek_v4_flash/test_npu_deepseek_v4_flash_prefill_graph_purep.py
      run_start_metadata: ${{ needs.set-image-config.outputs.run_start_metadata }}
    secrets: inherit

  # SR1: pure-prefill benchmark, 16P (TP16/DP16 -> 512 token/rank).
  sr1-perf-16-npu-a3:
    name: sr1-perf-16-npu-a3
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-single-node-test-stage.yml
    with:
      runner: linux-aarch64-a3-800t-16
      test_type: perf
      test_suite: full-perf-16-npu-a3
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      only_tests: |
        test/registered/npu/performance/deepseek_v4_flash/test_npu_deepseek_v4_flash_prefill_graph_purep_16p.py
      run_start_metadata: ${{ needs.set-image-config.outputs.run_start_metadata }}
    secrets: inherit

  # SR2: Qwen3-8B non-spec decode + Qwen3-8B-W8A8 modelslim (FIA V2).
  sr2-acc-2-npu-a3:
    name: sr2-acc-2-npu-a3
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-single-node-test-stage.yml
    with:
      runner: linux-aarch64-a3-2
      test_type: accuracy
      test_suite: full-acc-2-npu-a3
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      only_tests: |
        test/registered/npu/accuracy/qwen3-8b/test_npu_qwen3_8b_w8a8_1p_in3k5_out1k5_50ms_gpqa.py
        test/registered/npu/accuracy/qwen3-8b/test_npu_qwen3_8b_w8a8_1p_in6k_out1k5_bs16_gpqa.py
      run_start_metadata: ${{ needs.set-image-config.outputs.run_start_metadata }}
    secrets: inherit

  # SR3: Qwen3-8B EAGLE3 with decode graph enabled (validation branch only).
  sr3-eagle-2-npu-a3:
    name: sr3-eagle-2-npu-a3
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-single-node-test-stage.yml
    with:
      runner: linux-aarch64-a3-2
      test_type: accuracy
      test_suite: nightly-1-npu-a3
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
      only_tests: |
        test/registered/npu/basic_function/speculative_inference/test_npu_eagle3.py
      run_start_metadata: ${{ needs.set-image-config.outputs.run_start_metadata }}
    secrets: inherit

  # SR3: MiMo-V2.5 MultiLayer manual case (runs only if the weight is cached).
  sr3-mimo-8-npu-a3:
    name: sr3-mimo-8-npu-a3
    needs: [set-image-config]
    runs-on: linux-aarch64-a3-8
    container:
      image: ${{ needs.set-image-config.outputs.image_a3 }}
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Overlay repo test utils
        shell: bash
        run: |
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r $(pwd)/python/sglang/test/ascend ${ascend_test_util_path}
          ln -sf $(pwd) /root/sglang
      - name: Probe MiMo weight cache
        id: probe
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from sglang.test.ascend.test_ascend_utils import MIMO_V2_5_W8A8_WEIGHTS_PATH
          import os
          print(MIMO_V2_5_W8A8_WEIGHTS_PATH)
          raise SystemExit(0 if os.path.isdir(MIMO_V2_5_W8A8_WEIGHTS_PATH) else 1)
          PY
          echo "weight_present=$?" >> $GITHUB_OUTPUT
      - name: Run MiMo MultiLayer
        if: steps.probe.outputs.weight_present == '0'
        shell: bash
        run: |
          python -u test/manual/ascend/llm_models/test_npu_mimo_v2_5_w8a8.py

  # SR1: startup gates (full / alltoallv / torch.compile), no full evaluation.
  sr1-gates-a3-8:
    name: sr1-gates-a3-8
    needs: [set-image-config]
    runs-on: linux-aarch64-a3-8
    container:
      image: ${{ needs.set-image-config.outputs.image_a3 }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Overlay repo test utils
        shell: bash
        run: |
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r $(pwd)/python/sglang/test/ascend ${ascend_test_util_path}
          ln -sf $(pwd) /root/sglang
      - name: Run startup gates
        shell: bash
        run: |
          python -u test/manual/ascend/test_npu_prefill_graph_gates.py

  # SR1/SR2: GLM-5.3 / GLM-5.2 16P accuracy (2-node PD-mix).
  multi-node-glm-a3:
    name: multi-node-glm-a3
    needs: [set-image-config]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          - name: glm_5_3_w8a8_16p_gpqa
            node_size: 2
            test_case: test/registered/npu/accuracy/glm5_3/test_npu_glm_5_3_w8a8_16p_gpqa.py
            test_type: 'accuracy'
            prefill_decode_deployment: 'mix'
          - name: glm_5_2_w8a8_16p_gpqa
            node_size: 2
            test_case: test/registered/npu/accuracy/glm5_2/test_npu_glm_5_2_w8a8_16p_gpqa.py
            test_type: 'accuracy'
            prefill_decode_deployment: 'mix'
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-8
      test_type: ${{ matrix.test_config.test_type }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: ${{ matrix.test_config.prefill_decode_deployment }}
      transformers_version: ''
      run_start_metadata: ${{ needs.set-image-config.outputs.run_start_metadata }}
