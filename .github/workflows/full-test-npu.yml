          #   test_type: 'perf'
          #   prefill_decode_deployment: 'separation'
          # - name: glm_5_2_w4a8_2p1d_32p_in128k_out1k_prefix90_20ms
          #   prefill_size: 2
          #   decode_size: 2
          #   router_size: 1
          #   test_case: test/registered/npu/performance/glm5_2/test_npu_glm_5_2_w4a8_2p1d_32p_in128k_out1k_prefix90_20ms.py
          #   test_type: 'perf'
          #   prefill_decode_deployment: 'separation'
          # glm5.1 performance tests
          # - name: glm5_1_w4a8_1p1d_32p_in65k_out1k5_prefix90_25ms
          #   prefill_size: 2
          #   decode_size: 2
