name: Full Test (NPU)

on:
#  pull_request:
#    branches:
#      - testcases-261015
#    paths:
#      - ".github/workflows/full-test-npu.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      job_filter:
        description: 'Select which job to run (leave empty or "all" to run all jobs)'
        required: false
        type: string
        default: 'all'
      image_a3:
        description: 'The a3 running docker image of the test task. Must be an image with sglang preinstalled (e.g. lmsysorg/sglang:*a3*).'
        required: false
        type: string
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.2.0-a3-B052'
      coverage_mode:
        description: 'Run in coverage mode: full and nightly basic-function/accuracy suites collect coverage (per-job artifacts); perf and multi-node suites run normally.'
        required: false
        type: boolean
        default: false

concurrency:
  group: full-test-npu-${{ inputs.coverage_mode == true && 'coverage-' || '' }}${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.set-vars.outputs.ref }}
      job_filter: ${{ steps.set-vars.outputs.job_filter }}
      image_a3: ${{ steps.set-vars.outputs.image_a3 }}
      coverage_mode: ${{ steps.set-vars.outputs.coverage_mode }}
    steps:
      # When triggered by PR, no inputs parameters are used. The latest community code is tested by default.
      - name: Set image config
        id: set-vars
        run: |
          if [ -z "${{ inputs.ref }}" ]; then
            echo "ref=" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.job_filter }}" ]; then
            echo "job_filter=all" >> $GITHUB_OUTPUT
          else
            echo "job_filter=${{ inputs.job_filter }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.image_a3 }}" ]; then
            echo "image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.2.0-a3-B052" >> $GITHUB_OUTPUT
          else
            echo "image_a3=${{ inputs.image_a3 }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.coverage_mode }}" ]; then
            echo "coverage_mode=false" >> $GITHUB_OUTPUT
          else
            echo "coverage_mode=${{ inputs.coverage_mode }}" >> $GITHUB_OUTPUT
          fi

          # If triggered by a PR, use the PR source branch label; otherwise the current ref name.
          BRANCH_LABEL="$HEAD_LABEL"
          if [ -z "${BRANCH_LABEL}" ]; then
            BRANCH_LABEL="${{ github.ref_name }}"
          fi
          BRANCH_LABEL="$(echo "${BRANCH_LABEL}" | tr -cd 'a-zA-Z0-9._/:' | tr '/:' '--')"
          # Package run metadata (branch/workflow/create_time) as a single JSON for reuse by all
          # test jobs; create_time is UTC+8 date + time (minute precision) recorded once at run
          # start, shared even across midnight. Consumers parse it with fromJson(), so this must
          # always be written — an empty value breaks the reusable workflow at template validation.
          RUN_START_METADATA="$(python3 -c "import json,sys; print(json.dumps({'branch_label':sys.argv[1],'workflow_name':sys.argv[2],'create_time':sys.argv[3]}))" "$BRANCH_LABEL" "${{ github.workflow }}" "$(date -u -d '+8 hours' +%Y%m%d-%H%M)")"
          echo "run_start_metadata=${RUN_START_METADATA}" >> $GITHUB_OUTPUT

  # The router the PD tests in nightly-test-4-npu-a3, nightly-poc-multi-node-tests
  # and the nightly-poc-multi-node-accuracy-* jobs launch.
  sgl-router-build-aarch64:
    if: ${{ needs.set-image-config.outputs.job_filter == 'all' || contains(format(',{0},', needs.set-image-config.outputs.job_filter), ',nightly-test-4-npu-a3,') || contains(format(',{0},', needs.set-image-config.outputs.job_filter), ',nightly-poc-multi-node-tests,') || contains(format(',{0},', needs.set-image-config.outputs.job_filter), ',nightly-poc-multi-node-accuracy-odd-day,') || contains(format(',{0},', needs.set-image-config.outputs.job_filter), ',nightly-poc-multi-node-accuracy-even-day,') }}
    needs: [set-image-config]
    uses: ./.github/workflows/_pr-test-sgl-router-build.yml
    with:
      git_ref: ${{ inputs.ref || '' }}
      runs_on: ubuntu-22.04-arm
      artifact_name: sgl-router-aarch64-nightly-npu
    secrets: inherit

  # test pp : deepseekv4 flash
  full-perf-test-16-npu-a3-verity:
    name: full-perf-test-16-npu-a3-verity
    if: ${{ (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') && (needs.set-image-config.outputs.job_filter == 'all' || contains(format(',{0},', needs.set-image-config.outputs.job_filter), ',full-perf-test-16-npu-a3,')) }}
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-pr-test-stage.yml
    with:
      self_name: full-perf-test-16-npu-a3-verity
      runner_config: linux-aarch64-a3-800t-16
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      run_timeout_minutes: '240'
      timeout_per_file: '3600'
      ref: ${{ needs.set-image-config.outputs.ref }}
      is_nightly_pipeline_job: true
      skip_pr_test_health_check: 'true'
    secrets: inherit

  # test pp : GLM5.3
  nightly-poc-multi-node-tests:
    name: multi-node-poc
    if: ${{ always() && needs.set-image-config.result == 'success' && (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          - name: glm_5_3_w8a8_1p1d_32p_in128k_out1k_prefix90_20ms
            prefill_size: 2
            decode_size: 2
            router_size: 1
            test_case: test/registered/npu/performance/glm5_3/test_npu_glm_5_3_w8a8_1p1d_32p_in128k_out1k_prefix90_20ms.py
            test_type: 'perf'
            prefill_decode_deployment: 'separation'
          - name: glm_5_3_w8a8_1p1d_32p_in128k_out1k_prefix90_20ms_dynamic_chunking
            prefill_size: 2
            decode_size: 2
            router_size: 1
            test_case: test/registered/npu/performance/glm5_3/test_npu_glm_5_3_w8a8_1p1d_32p_in128k_out1k_prefix90_20ms_dynamic_chunking.py
            test_type: 'perf'
            prefill_decode_deployment: 'separation'
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      ref: ${{ inputs.ref || '' }}
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type || 'perf' }}
      test_config_name: ${{ matrix.test_config.name }}
      prefill_size: ${{ matrix.test_config.prefill_size }}
      decode_size: ${{ matrix.test_config.decode_size }}
      router_size: ${{ matrix.test_config.router_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      prefill_decode_deployment: ${{ matrix.test_config.prefill_decode_deployment }}
      transformers_version: ''
      run_start_metadata: ${{ needs.set-image-config.outputs.run_start_metadata }}
      accuracy_dataset: ${{ matrix.test_config.test_type == 'accuracy' && needs.set-image-config.outputs.accuracy_dataset || '' }}
      sgl_router_artifact: ${{ needs.sgl-router-build-aarch64.outputs.artifact_name }}

  # test pp : kimi K3
  full-poc-multi-node-mix-tests-pp:
    name: multi-node-mix-poc
    if: ${{ always() && needs.set-image-config.result == 'success' && (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          - name: kimi_k3_w4a8_32p_mix_in128k_out1_prefill_pp_baseline
            node_size: 4
            test_case: test/registered/npu/performance/kimi_k3/test_npu_kimi_k3_w4a8_32p_mix_in128k_out1_prefill_pp_baseline.py
            test_type: 'accuracy'
          - name: kimi_k3_w4a8_32p_mix_in128k_out1_prefill_pp_dynamic_chunking
            node_size: 4
            test_case: test/registered/npu/performance/kimi_k3/test_npu_kimi_k3_w4a8_32p_mix_in128k_out1_prefill_pp_dynamic_chunking.py
            test_type: 'perf'
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type || 'perf' }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: 'mix'
      transformers_version: ''

  # test dcp : kimi K3
  full-poc-multi-node-mix-tests-dcp:
    name: multi-node-mix-poc
    if: ${{ always() && needs.set-image-config.result == 'success' && (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config:
          - name: kimi_k3_w4a8_32p_dcp_gpqa
            node_size: 4
            test_case: test/registered/npu/accuracy/kimi_k3/test_npu_kimi_k3_w4a8_32p_dcp_gpqa.py
            test_type: 'accuracy'
          - name: kimi_k3_w4a8_32p_dcp_mix_in128k_out1k_decode_prefix
            node_size: 4
            test_case: test/registered/npu/performance/kimi_k3/test_npu_kimi_k3_w4a8_32p_dcp_mix_in128k_out1k_decode_prefix.py
            test_type: 'perf'
          - name: kimi_k3_w4a8_32p_mix_in128k_out1k_decode_prefix
            node_size: 4
            test_case: test/registered/npu/performance/kimi_k3/test_npu_kimi_k3_w4a8_32p_mix_in128k_out1k_decode_prefix.py
            test_type: 'perf'
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type || 'perf' }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: 'mix'
      transformers_version: ''
