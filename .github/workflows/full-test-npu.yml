  check-all-jobs:
    if: github.repository == 'sgl-project/sglang' && always()
    needs:
      - nighly-test-npu
      - full-4-npu-a2
      - full-1-npu-a3
      - full-2-npu-a3
      - full-4-npu-a3
      - full-8-npu-a3
      - full-16-npu-a3
      - full-acc-2-npu-a3
      - full-acc-4-npu-a3
      - full-acc-16-npu-a3
      - full-perf-2-npu-a3
      - full-perf-4-npu-a3
      - full-perf-8-npu-a3
      - full-perf-16-npu-a3
      - full-poc-multi-node-tests
      - full-poc-multi-node-mix-tests
    runs-on: ubuntu-latest
    container:
      image: docker.m.daocloud.io/ubuntu:22.04
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more nightly test jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more nightly test jobs were cancelled"
            exit 1
          fi
          echo "All nightly test jobs passed"

  coverage-report:
    # Must wait for ALL coverage-producing jobs (same list as check-all-jobs,
    # plus set-image-config for image/ref), otherwise artifacts from jobs that
    # are still running are missed by download-artifact.
    needs:
      [
        set-image-config,
        nighly-test-npu,
        full-4-npu-a2,
        full-1-npu-a3,
        full-2-npu-a3,
        full-4-npu-a3,
        full-8-npu-a3,
        full-16-npu-a3,
        full-acc-2-npu-a3,
        full-acc-4-npu-a3,
        full-acc-16-npu-a3,
        full-perf-2-npu-a3,
        full-perf-4-npu-a3,
        full-perf-8-npu-a3,
        full-perf-16-npu-a3,
        full-poc-multi-node-tests,
        full-poc-multi-node-mix-tests,
      ]
    if: always()
    runs-on: linux-aarch64-a3-2
    container:
      image: ${{ needs.set-image-config.outputs.image_a3 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-image-config.outputs.ref || github.ref }}

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: /tmp/coverage_data
          merge-multiple: true

      - name: Upload all raw coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/coverage_data/.coverage*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Combine and generate report
        run: |
          DATA_DIR=/tmp/coverage_data
          echo "=== Coverage data files ==="
          ls -la "$DATA_DIR"/.coverage* 2>/dev/null || echo "No .coverage files found"
          if ls "$DATA_DIR"/.coverage* 1>/dev/null 2>&1; then
            python -c "import coverage" 2>/dev/null || pip install coverage --retries 3 || pip install coverage -i https://pypi.tuna.tsinghua.edu.cn/simple/
            coverage combine "$DATA_DIR"
            # 诊断：combine 后生成的合并数据文件（存在但为 0 字节 = 无有效测量数据）。
            ls -la ./.coverage 2>/dev/null || echo "combine produced no .coverage file"
            coverage report -m
            coverage html
          else
            echo "No coverage data found, skipping report generation."
            mkdir -p htmlcov
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: htmlcov/
          retention-days: 30
