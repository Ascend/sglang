  full-acc-2-npu-a3:
    name: full-acc-2-npu-a3
    if: ${{ (github.repository == 'sgl-project/sglang' || github.event_name == 'pull_request') }}
    needs: [set-image-config]
    uses: ./.github/workflows/_npu-single-node-test-stage.yml
    with:
      runner: linux-aarch64-a3-800i-2
      test_type: 'accuracy'
      test_suite: full-acc-2-npu-a3
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      is_nightly_pipeline_job: true
      # Coverage mode: 2x timeout budget.
      test_timeout_minutes: ${{ needs.set-image-config.outputs.coverage_mode == 'true' && '960' || '480' }}
      partitions: '{"size":5,"arr":[0,1,2,3,4]}'
      device_type_for_deps: 'a3'
      skip_pr_test_health_check: 'true'
      use_coverage_runner: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
      upload_coverage_artifact: ${{ needs.set-image-config.outputs.coverage_mode == 'true' }}
