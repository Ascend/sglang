name: Full Test (NPU)

on:
  pull_request:
    branches:
      - main
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/full-test-npu.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      job_filter:
        description: 'Select which job to run (leave empty or "all" to run all jobs)'
        required: false
        type: string
        default: 'all'
      image_a3:
        description: 'The a3 running docker image of the test task.'
        required: false
        type: string
        default: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3'
      skip_install_flag:
        description: 'Indicates whether to skip the installation of sglang, defaulting to false.'
        required: false
        type: string
        default: ''
      test_scope:
        description: 'Test scope: all / func / poc / no_nightly / poc_no_nightly'
        required: true
        type: choice
        options:
          - all
          - func
          - poc
          - no_nightly
          - poc_no_nightly
        default: 'poc'

concurrency:
  group: full-test-npu-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  set-image-config:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.set-vars.outputs.ref }}
      job_filter: ${{ steps.set-vars.outputs.job_filter }}
      image_a3: ${{ steps.set-vars.outputs.image_a3 }}
      skip_install_flag: ${{ steps.set-vars.outputs.skip_install_flag }}
      test_scope: ${{ steps.set-vars.outputs.test_scope }}
    steps:
      # When triggered by PR, no inputs parameters are used. The latest community code is tested by default.
      - name: Set image config
        id: set-vars
        run: |
          echo "========== INPUT PARAMETERS =========="
          echo "inputs.ref            = ${{ inputs.ref }}"
          echo "inputs.job_filter     = ${{ inputs.job_filter }}"
          echo "inputs.image_a3        = ${{ inputs.image_a3 }}"
          echo "inputs.skip_install_flag = ${{ inputs.skip_install_flag }}"
          echo "inputs.test_scope      = ${{ inputs.test_scope }}"
          echo "======================================="
          if [ -z "${{ inputs.ref }}" ]; then
            echo "ref=" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ inputs.ref }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.job_filter }}" ]; then
            echo "job_filter=all" >> $GITHUB_OUTPUT
          else
            echo "job_filter=${{ inputs.job_filter }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.image_a3 }}" ]; then
            echo "image_a3=swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3" >> $GITHUB_OUTPUT
          else
            echo "image_a3=${{ inputs.image_a3 }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.skip_install_flag }}" ]; then
            echo "skip_install_flag=true" >> $GITHUB_OUTPUT
          else
            echo "skip_install_flag=${{ inputs.skip_install_flag }}" >> $GITHUB_OUTPUT
          fi

          if [ -z "${{ inputs.test_scope }}" ]; then
            echo "test_scope=poc" >> $GITHUB_OUTPUT
          else
            echo "test_scope=${{ inputs.test_scope }}" >> $GITHUB_OUTPUT
          fi

  discover-multi-node:
    name: discover-multi-node-matrix
    needs: [ set-image-config ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      matrix_separation: ${{ steps.discover.outputs.matrix_separation }}
      matrix_mix: ${{ steps.discover.outputs.matrix_mix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-image-config.outputs.ref || github.ref }}

      - name: Discover multi-node test matrix from CI registries
        id: discover
        run: |
          # Only kimi_k2_6 cases carry npu_multi_node registration for now;
          # remove --filter once more cases are migrated to the registry.
          python3 python/sglang/test/ci/gen_npu_multi_node_matrix.py \
            --test-dir test/registered/npu \
            --deployment separation \
            --filter kimi_k2_6 > /tmp/matrix_separation.json
          python3 python/sglang/test/ci/gen_npu_multi_node_matrix.py \
            --test-dir test/registered/npu \
            --deployment mix \
            --filter kimi_k2_6 > /tmp/matrix_mix.json
          cat /tmp/matrix_separation.json
          cat /tmp/matrix_mix.json
          {
            echo "matrix_separation<<EOF"
            cat /tmp/matrix_separation.json
            echo "EOF"
            echo "matrix_mix<<EOF"
            cat /tmp/matrix_mix.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  nightly-poc-multi-node-tests:
    name: multi-node-poc
    needs: [ set-image-config, discover-multi-node ]
    if: ${{ !cancelled() && (needs.set-image-config.outputs.test_scope == 'all' || needs.set-image-config.outputs.test_scope == 'poc' || needs.set-image-config.outputs.test_scope == 'no_nightly' || needs.set-image-config.outputs.test_scope == 'poc_no_nightly') && needs.discover-multi-node.outputs.matrix_separation != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Generated from register_npu_ci(..., npu_multi_node={...}) in the
        # registered test files; cases with the same resource profile are
        # batched into one Pod allocation.
        test_config: ${{ fromJson(needs.discover-multi-node.outputs.matrix_separation) }}
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type }}
      test_config_name: ${{ matrix.test_config.name }}
      prefill_size: ${{ matrix.test_config.prefill_size }}
      decode_size: ${{ matrix.test_config.decode_size }}
      router_size: ${{ matrix.test_config.router_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: ${{ matrix.test_config.prefill_decode_deployment }}
      transformers_version: ''

  nightly-poc-multi-node-mix-tests:
    name: multi-node-mix-poc
    needs: [ set-image-config, discover-multi-node ]
    if: ${{ !cancelled() && (needs.set-image-config.outputs.test_scope == 'all' || needs.set-image-config.outputs.test_scope == 'poc' || needs.set-image-config.outputs.test_scope == 'no_nightly' || needs.set-image-config.outputs.test_scope == 'poc_no_nightly') && needs.discover-multi-node.outputs.matrix_mix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_config: ${{ fromJson(needs.discover-multi-node.outputs.matrix_mix) }}
    uses: ./.github/workflows/nightly-test-npu-e2e-multi-node.yml
    with:
      runner: linux-amd64-cpu-4
      test_type: ${{ matrix.test_config.test_type }}
      test_config_name: ${{ matrix.test_config.name }}
      node_size: ${{ matrix.test_config.node_size }}
      test_case: ${{ matrix.test_config.test_case }}
      image: ${{ needs.set-image-config.outputs.image_a3 }}
      install_sglang_from_source: false
      prefill_decode_deployment: 'mix'
      transformers_version: ''

  check-all-jobs:
    needs:
      - set-image-config
      - discover-multi-node
      - nightly-poc-multi-node-tests
      - nightly-poc-multi-node-mix-tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Download all metrics
        uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          path: /tmp/metrics
          merge-multiple: false

      - name: Generate results table
        run: |
          echo "## Per-Test Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          has_metrics=false
          while IFS= read -r file; do
            has_metrics=true
            echo "import json" > /tmp/parse_metrics.py
            echo "with open('$file') as f:" >> /tmp/parse_metrics.py
            echo "    d = json.load(f)" >> /tmp/parse_metrics.py
            echo "tc = d.get('test_case', '-')" >> /tmp/parse_metrics.py
            echo "tp = d.get('test_type', '-')" >> /tmp/parse_metrics.py
            echo "st = d.get('status', 'unknown')" >> /tmp/parse_metrics.py
            echo "icon = '✅' if st == 'pass' else '❌'" >> /tmp/parse_metrics.py
            echo "metrics = d.get('metrics', {})" >> /tmp/parse_metrics.py
            echo "baselines = d.get('baselines', {})" >> /tmp/parse_metrics.py
            echo "mstr = ', '.join(f'{k}={v}' for k,v in metrics.items()) if metrics else '-'" >> /tmp/parse_metrics.py
            echo "bstr = ', '.join(f'{k}={v}' for k,v in baselines.items()) if baselines else '-'" >> /tmp/parse_metrics.py
            echo "print(f'| {tc} | {tp} | {icon} {st} | {mstr} | {bstr} |')" >> /tmp/parse_metrics.py
            python3 /tmp/parse_metrics.py
          done < <(find /tmp/metrics -name metrics.json | sort) > /tmp/metrics_table.txt

          if [ "${has_metrics}" = "true" ]; then
            echo "| Test Case | Type | Status | Metrics | Baseline |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|------|--------|---------|----------|" >> $GITHUB_STEP_SUMMARY
            cat /tmp/metrics_table.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No per-test metrics available (artifacts not found)." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          FAIL=0
          ${{ needs.nightly-poc-multi-node-tests.result != 'success' && needs.nightly-poc-multi-node-tests.result != 'skipped' }} && FAIL=1
          ${{ needs.nightly-poc-multi-node-mix-tests.result != 'success' && needs.nightly-poc-multi-node-mix-tests.result != 'skipped' }} && FAIL=1
          exit $FAIL
