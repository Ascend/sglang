name: Release Docker Images (NPU)

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'tag后缀，如 B021, release20260810'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    strategy:
      matrix:
        cann_version: ["9.0.0"]
        device_type: ["910b", "a3"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang
          tags: |
            type=raw,value=${{ github.event.inputs.tag_suffix }}
          flavor: |
            latest=false
            suffix=-cann${{ matrix.cann_version }}-${{ matrix.device_type }}

      - name: Log into SWR
        uses: docker/login-action@v3
        if: ${{ github.repository == 'Ascend/sglang' }}
        with:
          registry: swr.cn-southwest-2.myhuaweicloud.com
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/npu1.Dockerfile
          platforms: linux/arm64,linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: ${{ github.repository == 'Ascend/sglang' && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          build-args: |
            SGLANG_KERNEL_NPU_TAG=20260826
            CANN_VERSION=${{ matrix.cann_version }}
            DEVICE_TYPE=${{ matrix.device_type }}

  manifest:
    needs: build
    if: ${{ github.repository == 'Ascend/sglang' }}
    uses: ./.github/workflows/generate-image-manifest.yml
    secrets: inherit
    concurrency:
      group: manifest-deploy
      cancel-in-progress: false
    strategy:
      matrix:
        cann_version: ["9.0.0"]
        device_type: ["910b", "a3"]
    with:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:${{ github.event.inputs.tag_suffix }}-cann${{ matrix.cann_version }}-${{ matrix.device_type }}
      dockerfile: docker/npu1.Dockerfile
      build_args: |
        SGLANG_KERNEL_NPU_TAG=20260826
        CANN_VERSION=${{ matrix.cann_version }}
        DEVICE_TYPE=${{ matrix.device_type }}
      artifact_name: image-manifest-cann${{ matrix.cann_version }}-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix }}
      deploy_pages: 'true'
