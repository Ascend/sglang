name: PR Test - Build sgl-router

# Builds sgl-router once per run for the stages that launch it; the source-hash
# cache carries it across runs. No interpreter or torch ABI, so one compile job
# per arch.

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Runner label for the compile job. Its glibc has to be at most 2.35.'
        type: string
        required: true
      artifact_name:
        description: 'Artifact name. Suffix it per caller: artifacts are immutable per name per run, so two callers sharing a run would collide.'
        type: string
        default: sgl-router-x86_64
      git_ref:
        type: string
        default: ''
    outputs:
      artifact_name:
        description: 'Artifact holding the binary. Empty when neither job published one; consumers then fall back to the cache, then to a local build.'
        value: ${{ jobs.restore.outputs.artifact_name || jobs.compile.outputs.artifact_name }}

# check-maintenance reads this; reusable workflows do not inherit the caller's env.
env:
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' && 'true' || 'false' }}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Restore sgl-router
    outputs:
      hit: ${{ steps.cache.outputs.cache-hit }}
      key: ${{ steps.cache.outputs.cache-primary-key }}
      artifact_name: ${{ steps.publish.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.git_ref || (github.event_name == 'pull_request_target' && github.event.pull_request.head.sha) || github.sha }}
          # Fork PR code under pull_request_target: safe because pr-gate.yml approved this exact
          # commit first and the checkout keeps no credentials (persist-credentials: false).
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          # What the cache key hashes, plus the actions and scripts this job runs.
          sparse-checkout: |
            experimental/sgl-router
            .github
            scripts/ci/utils
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/check-maintenance

      - name: Restore built binary
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: sgl-router-bin/sgl-router
          # The arch is the compile runner's, as download-sgl-router reads it.
          key: sgl-router-${{ contains(inputs.runs_on, '-arm') && 'aarch64' || 'x86_64' }}-${{ hashFiles('experimental/sgl-router/**', '.github/workflows/_pr-test-sgl-router-build.yml') }}

      - name: Upload binary
        if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: sgl-router-bin/sgl-router
          if-no-files-found: error
          retention-days: 1

      - name: Publish artifact name
        id: publish
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"

  compile:
    needs: restore
    if: needs.restore.outputs.hit != 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 60
    name: Build sgl-router
    outputs:
      artifact_name: ${{ steps.publish.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.git_ref || (github.event_name == 'pull_request_target' && github.event.pull_request.head.sha) || github.sha }}
          # Fork PR code under pull_request_target: safe because pr-gate.yml approved this exact
          # commit first and the checkout keeps no credentials (persist-credentials: false).
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - uses: ./.github/actions/check-maintenance

      - name: Install Rust toolchain
        run: bash scripts/ci/utils/install_rustup.sh

      # sgl-router lives at experimental/sgl-router and is its own cargo workspace
      # with a committed Cargo.lock, so build the binary directly. The
      # RUSTUP_TOOLCHAIN pin install_rustup.sh exports would outrank the router's
      # rust-toolchain.toml, so unset it to build at the router's own toolchain.
      # libpcre2-8 is vendored so the binary runs where the system library is absent.
      - name: Build sgl-router
        env:
          PCRE2_SYS_STATIC: '1'
        run: |
          set -euo pipefail
          unset RUSTUP_TOOLCHAIN
          cd experimental/sgl-router
          cargo build --locked --release --bin sgl-router
          install -D -m 0755 target/release/sgl-router "${GITHUB_WORKSPACE}/sgl-router-bin/sgl-router"
          "${GITHUB_WORKSPACE}/sgl-router-bin/sgl-router" --version

      # The oldest test image (jammy) has glibc 2.35; a newer requirement fails at exec.
      - name: Check the binary's glibc requirement
        env:
          MAX_GLIBC: '2.35'
        run: |
          set -euo pipefail
          symbols=$(objdump -T sgl-router-bin/sgl-router)
          needed=$(printf '%s\n' "${symbols}" | grep -oE 'GLIBC_2\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1 || true)
          echo "sgl-router requires glibc ${needed:-none}"
          if [ -n "${needed}" ] \
             && [ "$(printf '%s\n%s\n' "${MAX_GLIBC}" "${needed}" | sort -V | tail -1)" != "${MAX_GLIBC}" ]; then
              echo "::error::sgl-router requires glibc ${needed} > ${MAX_GLIBC}; build on an older image"
              exit 1
          fi

      - name: Ensure zstd so the restore job can read what this job saves
        run: bash scripts/ci/utils/ensure_zstd.sh

      # After the glibc check, so a rejected build cannot poison this key.
      - name: Save built binary
        if: github.event_name != 'pull_request_target'
        uses: actions/cache/save@v4
        with:
          path: sgl-router-bin/sgl-router
          key: ${{ needs.restore.outputs.key }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: sgl-router-bin/sgl-router
          if-no-files-found: error
          retention-days: 1

      - name: Publish artifact name
        id: publish
        run: echo "name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
