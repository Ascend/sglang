name: Release Docker Images Nightly

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'tag后缀，如 B021, release20260810'
        required: false
        type: string
        default: 'nightly'

jobs:
  build:
    name: build ${{ matrix.platform }}-${{ matrix.device_type }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: a3
            platform: amd64
            runner: ubuntu-latest
          - device_type: a3
            platform: arm64
            runner: ubuntu-22.04-arm
          - device_type: 950
            platform: amd64
            runner: ubuntu-latest
          - device_type: 950
            platform: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: false

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate full image tag
        run: |
          echo "FULL_TAG=cann9.1.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'nightly' }}-${{ matrix.platform }}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang
          tags: type=raw,value=${{ env.FULL_TAG }}

      - name: Log into SWR
        uses: docker/login-action@v3
        if: ${{ github.repository == 'Ascend/sglang' }}
        with:
          registry: swr.cn-southwest-2.myhuaweicloud.com
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          # 合并后的单份 Dockerfile，a3 / 950 由 DEVICE_TYPE 分支决定
          file: docker/npu.Dockerfile
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: ${{ github.repository == 'Ascend/sglang' && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.device_type }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.device_type }}-${{ matrix.platform }}
          build-args: |
            SGLANG_KERNEL_NPU_TAG=2026.9.0.post5
            CANN_VERSION=9.1.0
            DEVICE_TYPE=${{ matrix.device_type }}

  merge:
    name: merge multi-arch manifest
    needs: build
    if: ${{ github.repository == 'Ascend/sglang' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device_type: ["a3", "950"]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-southwest-2.myhuaweicloud.com
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Create multi-arch manifest
        env:
          IMAGE: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'nightly' }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}" \
            "${IMAGE}-amd64" \
            "${IMAGE}-arm64"
          # 如果 SWR 或下游拉取端不兼容 OCI index，改用 Docker schema2 manifest list：
          #   docker manifest create "${IMAGE}" "${IMAGE}-amd64" "${IMAGE}-arm64"
          #   docker manifest push "${IMAGE}"

  manifest:
    needs: merge
    if: ${{ github.repository == 'Ascend/sglang' }}
    uses: ./.github/workflows/generate-image-manifest.yml
    secrets: inherit
    concurrency:
      # Unique per workflow + matrix leg + tag (shared reusable manifest
      # workflow; see release-docker-dev.yml).
      group: manifest-deploy-${{ github.workflow }}-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'nightly' }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - device_type: a3
          - device_type: 950
    with:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'nightly' }}
      # 与 build job 用同一份合并后的 Dockerfile
      dockerfile: docker/npu.Dockerfile
      build_args: |
        SGLANG_KERNEL_NPU_TAG=2026.9.0.post5
        CANN_VERSION=9.1.0
        DEVICE_TYPE=${{ matrix.device_type }}
      artifact_name: image-manifest-cann9.1.0-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix || 'nightly' }}
      deploy_pages: 'true'