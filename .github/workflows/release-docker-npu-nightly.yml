name: Release Docker Images Nightly

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'tag后缀，如 B021, release20260810'
        required: true
        type: string
      sglang_tag:
        description: '构建用的 sglang 源码分支/标签（默认 main = 上游 sgl-project/sglang）'
        required: false
        default: main
        type: string

env:
  # ---- 统一版本口径：tag、基础镜像、kernel 包都由这里驱动，避免多处硬编码不一致 ----
  CANN_VERSION: "9.1.0"
  OS: "ubuntu22.04"
  PYTHON_VERSION: "py3.12"
  SGLANG_KERNEL_NPU_TAG: "2026.9.0.post5"
  IMAGE: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang
  DOCKERFILE: docker/npu.Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # 同一个 Dockerfile 覆盖两种设备，差异只通过 DEVICE_TYPE 传入
        include:
          - device_type: a3
          - device_type: 950
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate full image tag
        run: |
          echo "FULL_TAG=cann${CANN_VERSION}-${{ matrix.device_type }}-${{ github.event.inputs.tag_suffix }}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.FULL_TAG }}

      - name: Log into SWR
        uses: docker/login-action@v3
        if: ${{ github.repository == 'Ascend/sglang' }}
        with:
          registry: swr.cn-southwest-2.myhuaweicloud.com
          username: ${{ secrets.SWR_SOUTH_2_USERNAME }}
          password: ${{ secrets.SWR_SOUTH_2_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64,linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: ${{ github.repository == 'Ascend/sglang' && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          build-args: |
            SGLANG_KERNEL_NPU_TAG=${{ env.SGLANG_KERNEL_NPU_TAG }}
            SGLANG_TAG=${{ github.event.inputs.sglang_tag || 'main' }}
            CANN_VERSION=${{ env.CANN_VERSION }}
            DEVICE_TYPE=${{ matrix.device_type }}
            OS=${{ env.OS }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          # 这个 Dockerfile 没有用 --mount=type=secret，GITCODE_TOKEN 目前不会被消费；
          # 如果以后改成从私有仓库 clone 源码，再在这里传 token 并在 Dockerfile 里 mount。
          secrets: |
            gitcode_token=${{ secrets.GITCODE_TOKEN }}
