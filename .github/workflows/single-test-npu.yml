name: Single Test (NPU)
# test round 1: <测试用例描述>

on:
  pull_request:
    branches:
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/single-test-npu.yml"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-node-poc:
    name: single-node-poc
    runs-on: linux-aarch64-a3-800t-16
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-20260908
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check npu info
        run: |
          npu-smi info

      - name: Install dependencies
        timeout-minutes: 60
        env:
          GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_USE_MODELSCOPE: true
        shell: bash
        run: |
          set -euo pipefail
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"

          # Use internal caching mirrors (same as official NPU CI):
          # direct access to pypi.org/github.com is unreliable from the cluster.
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host "${CACHING_URL}"

          # Use ascend test utils from PR code
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r $(pwd)/python/sglang/test/ascend ${ascend_test_util_path}

          pip install sentence_transformers zss "wandb>=0.16.0" tenacity==8.3.0 loguru openpyxl latex2sympy2 zstandard transformers-stream-generator tqdm-multiprocess pycocoevalcap
          pip install yt-dlp sentencepiece==0.1.99 nltk av ftfy sqlitedict==2.1.0 "sacrebleu>=1.5.0" pytablewriter "peft>=0.2.0" "accelerate>=0.29.1"
          pip install jsonlines "evaluate>=0.4.0" numexpr dotenv
          pip install websocket

          # Install sgl-eval
          # shellcheck source=scripts/ci/utils/sgl_eval_ref.sh
          . "${sglang_source_path}/scripts/ci/utils/sgl_eval_ref.sh"
          SGL_EVAL_SPEC="sgl-eval @ git+${GITHUB_PROXY_URL}https://github.com/sgl-project/sgl-eval.git@${SGL_EVAL_REF}"
          pip install "$SGL_EVAL_SPEC"

          git clone --branch v0.3.3 --depth 1 ${GITHUB_PROXY_URL}https://github.com/EvolvingLMMs-Lab/lmms-eval.git
          cd ./lmms-eval
          nohup pip install . > lmmslog.txt 2>&1 &
          cd ..

          hf download MMMU/MMMU --repo-type dataset

          # install sglang_router
          apt-get install -y libssl-dev
          pip install sglang_router

      - name: Run test
        timeout-minutes: 2880
        env:
          SGLANG_USE_MODELSCOPE: true
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_IS_IN_CI: true
        shell: bash
        run: |
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          ln -sf ${sglang_source_path} /root/sglang

          # Test cases - 使用时替换为实际的测试用例路径
          test_cases=(
            "test/registered/npu/basic_function/kernel_backends/test_npu_sampling_backend.py"
            "test/registered/npu/basic_function/HiCache/test_npu_hicache_page.py"
            "test/registered/npu/basic_function/memory_and_scheduling/test_npu_no_chunked_prefill.py"
            "test/registered/npu/basic_function/api_related/test_npu_api_related_asr_max.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_auto_qwen3_235b_a22b_w8a8.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_auto_qwen3_30b_a3b_w8a8.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_low_latency_qwen3_235b_a22b_w8a8.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_low_latency_qwen3_30b_a3b_w8a8.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_low_latency_deepseek_R1_0528_w4a8_per_channel.py"
            "test/registered/npu/basic_function/EPD/test_npu_epd_disaggregation.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_auto_deepseek_R1_0528_w4a8_per_channel.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_auto_deepseek_v3_2_w8a8.py"
          )

          for test_case in "${test_cases[@]}"; do
            if [ ! -f "${sglang_source_path}/${test_case}" ]; then
              echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
              exit 1
            fi
          done

          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

          echo "scaling_governor performance num: \
            $(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | grep performance | wc -l)"
          echo "swappiness: $(cat /proc/sys/vm/swappiness)"
          echo "numa_balancing: $(cat /proc/sys/kernel/numa_balancing)"
          echo "sched_migration_cost_ns: $(cat /proc/sys/kernel/sched_migration_cost_ns)"

          export SGLANG_TEST_MAX_RETRY=0
          export SGLANG_SET_CPU_AFFINITY=1
          echo "SGLANG_SET_CPU_AFFINITY: $SGLANG_SET_CPU_AFFINITY"

          # Set environment of cann
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true

          current_date=$(date +%Y%m%d)
          log_path="/root/.cache/tests/logs/log/${current_date}/${HOSTNAME}"
          rm -rf ${log_path}
          mkdir -p ${log_path}
          echo "Log path: ${log_path}"

          for test_case in "${test_cases[@]}"; do
            tc_name=$(basename ${test_case} .py)
            echo "Running test case ${test_case}"
            python -u ${sglang_source_path}/${test_case}
            echo "Finished test case ${test_case}"
          done

          plog_path="/root/ascend/log/debug/plog"
          if [ -d "$plog_path" ];then
            echo "Plog files found. Begin to backup them."
            target_plog_path="/root/.cache/tests/logs/plog/${HOSTNAME}"
            echo "Save path: ${target_plog_path}"
            rm -rf ${target_plog_path}
            mkdir -p ${target_plog_path}
            cp ${plog_path}/* ${target_plog_path}
          fi
