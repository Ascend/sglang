name: Single Test (NPU)
# DSv4.1 DSL 0.8.0 / CANN 9.2.0: single-card correctness, no model weights.

on:
  pull_request:
    branches:
      - testcases
      - testcases-261015
    paths:
      - ".github/workflows/single-test-npu.yml"

permissions:
  contents: read

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_COMMIT: e4565509de487e31c02729d2dd5377fcf95637b0
  SGLANG_COMMIT: 00fe9da12d280a99aa79a2786b3d11d7761ea44c

jobs:
  single-node-poc:
    name: DSv4.1 DSL correctness (A5, CANN 9.2.0)
    runs-on: linux-amd64-a5-1
    timeout-minutes: 120
    container:
      image: quay.io/ascend/cann:9.2.0-950-ubuntu22.04-py3.12@sha256:5c4fa2bb96c678d865eda4e50c8c4310fb013c3452c7a081afcb9c86ed318730
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact kernel revision
        uses: actions/checkout@v4
        with:
          repository: ClownBin/sgl-kernel-npu
          ref: ${{ env.KERNEL_COMMIT }}
          path: kernel
          persist-credentials: false

      - name: Checkout exact SGLang integration revision
        uses: actions/checkout@v4
        with:
          repository: randgun/sglang
          ref: ${{ env.SGLANG_COMMIT }}
          path: sglang
          persist-credentials: false

      - name: Prepare dependencies
        working-directory: kernel
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build ca-certificates git
          python3 -m pip install 'torch==2.13.0' --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install 'https://gitcode.com/Ascend/pytorch/releases/download/v26.2.0-pytorch2.13.0/torch_npu-2.13.0-cp312-cp312-manylinux_2_28_x86_64.whl'
          python3 -m pip install 'cannbot-dsl==0.8.0' 'pytest==9.2.0' setuptools wheel pybind11 pyyaml decorator scipy attrs psutil packaging numpy

      - name: Build and validate migrated wheel
        working-directory: kernel
        env:
          CANNBOTDSL_RUN_SMLA_TESTS: '1'
          CANNBOTDSL_NATIVE_BINARY_MODE: 'off'
          NPU_DEVICE_ID: '0'
        run: |
          set -eo pipefail
          sdk_env=''
          for candidate in /usr/local/Ascend/cann/set_env.sh /usr/local/Ascend/ascend-toolkit/set_env.sh /usr/local/Ascend/ascend-toolkit/latest/set_env.sh; do
            if [ -f "$candidate" ]; then sdk_env="$candidate"; break; fi
          done
          test -n "$sdk_env"
          source "$sdk_env"
          set -u
          unset PYTHONPATH
          mkdir -p ci-artifacts
          npu-smi info | tee ci-artifacts/npu-smi.txt
          python3 scripts/check_cannbotdsl_ci.py environment --commit "$KERNEL_COMMIT" --output ci-artifacts/environment.json
          # A minimal native op supplies the package loader; DSL executes from source JIT.
          python3 setup.py --arch-version 3510 --ops apply_token_bitmask --without-third-party -j4 2>&1 | tee ci-artifacts/build.log
          wheels=(output/sgl_kernel_npu-*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          sha256sum "${wheels[0]}" > ci-artifacts/wheel.sha256
          python3 -m pip install --force-reinstall --no-deps "${wheels[0]}"
          python3 scripts/check_cannbotdsl_ci.py installed --output ci-artifacts/installed.json
          test "$(git -C ../sglang rev-parse HEAD)" = "$SGLANG_COMMIT"
          printf '%s\n' "$SGLANG_COMMIT" > ci-artifacts/sglang-commit.txt
          # Check fixed A5 argument sets against installed signatures; no model dependencies.
          python3 ../sglang/test/manual/dsv4/check_dsv41_kernel_ops.py 2>&1 | tee ci-artifacts/sglang-api-contract.log
          python3 -m pip freeze > ci-artifacts/pip-freeze.txt
          python3 -m pytest -v --tb=short --npu-device 0 --junitxml=ci-artifacts/junit.xml \
            tests/python/sgl_kernel_npu/dsv41_cannbot_dsl/test_indexer_prologue_k.py \
            tests/python/sgl_kernel_npu/dsv41_cannbot_dsl/test_quant_lightning_indexer.py::test_quant_lightning_indexer \
            tests/python/sgl_kernel_npu/dsv41_cannbot_dsl/test_quant_sparse_lightning_indexer.py::test_quant_sparse_lightning_indexer \
            tests/python/sgl_kernel_npu/dsv41_cannbot_dsl/test_mixed_quant_sparse_flash_mla.py \
            tests/python/sgl_kernel_npu/dsv41_cannbot_dsl/test_metadata_graph.py \
            2>&1 | tee ci-artifacts/pytest.log
          python3 scripts/check_cannbotdsl_ci.py results --junit ci-artifacts/junit.xml --output ci-artifacts/result.json

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cannbot-dsv41-a5-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            kernel/ci-artifacts/
            kernel/build/cann/*.log
            kernel/build/torch/*.log
            kernel/output/*.whl
          if-no-files-found: warn
          retention-days: 7
