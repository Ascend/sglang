name: Single Test (NPU)
# test round 1: <测试用例描述>

on:
  pull_request:
    branches:
      - testcases
    paths:
      - ".github/workflows/single-test-npu.yml"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-node-poc:
    name: single-node-poc
    runs-on: linux-aarch64-a3-2-
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check npu info
        run: |
          npu-smi info

      - name: Run test
        timeout-minutes: 120
        env:
          SGLANG_USE_MODELSCOPE: true
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_IS_IN_CI: true
        shell: bash
        run: |
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          ln -sf ${sglang_source_path} /root/sglang

          # Test cases - 使用时替换为实际的测试用例路径
          test_cases=(
            "test/registered/ascend/llm_models/test_npu_llama_2_7b_communications_compression.py"
            "test/registered/ascend/llm_models/test_npu_qwq_32b_w8a8.py"
            "test/registered/ascend/basic_function/Multi-Modal/test_npu_multimodal_pd_disaggregation.py"
            "test/registered/ascend/basic_function/logging/test_npu_tracing_disaggregation.py"
            "test/registered/ascend/basic_function/lora/test_npu_lora_qwen3_6_27b_logprob_diff.py"
            "test/registered/ascend/vlm_models/test_npu_vlm_input_format.py"
            "test/registered/ascend/basic_function/HTTP/test_npu_nccl_port.py"
            "test/registered/ascend/basic_function/dp_attn/test_npu_dp_attention.py"
            "test/registered/ascend/basic_function/kernel_backends/test_npu_mm_attention_backend.py"
            "test/registered/ascend/vlm_models/test_npu_encoder_dp.py"
            "test/registered/ascend/vlm_models/test_npu_minicpm_o_2_6.py"
            "test/registered/ascend/vlm_models/test_npu_mistral_small_3_1_24b_instruct_2503.py"
            "test/registered/ascend/basic_function/optimization_debug_options/test_npu_attn_tp_gather_fuseep.py"
            "test/registered/ascend/basic_function/rl/test_npu_multi_instance_release_memory_occupation.py"
            "test/registered/ascend/basic_function/Multi-Modal/test_npu_mm_limit.py"
            "test/registered/ascend/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_auto_deepseek_v2.py"
            "test/registered/ascend/basic_function/mambacache/test_npu_qwen3_next_models_mtp.py"
            "test/registered/ascend/basic_function/runtime_options/test_npu_disaggregation_pp.py"
            "test/registered/ascend/llm_models/test_npu_grok_2.py"
            "test/registered/ascend/vlm_models/test_npu_qwen3_vl_235b_a22b_instruct.py"
            "test/registered/ascend/basic_function/lora/test_npu_lora_backend.py"
            "test/registered/ascend/basic_function/model_tokenizer/test_npu_model_tokenizer_multimodal.py"
            "test/registered/ascend/basic_function/speculative_inference/test_npu_adaptive_speculative.py"
            "test/registered/ascend/llm_models/test_npu_llama_2_7b.py"
            "test/registered/ascend/basic_function/lora/test_npu_lora_overlap_loading.py"
            "test/registered/ascend/basic_function/lora/test_npu_lora_qwen3.py"
            "test/registered/ascend/basic_function/openai_server/test_npu_serving_transcription.py"
            "test/registered/ascend/basic_function/lora/test_npu_lora_eviction.py"
            "test/registered/ascend/basic_function/api_related/test_npu_api_related_tool_call.py"
            "test/registered/ascend/basic_function/lora/test_npu_wait_threshold.py"
            "test/registered/ascend/basic_function/sessions/test_npu_streaming_session.py "
            "test/registered/ascend/basic_function/lora/test_npu_lora_radix_cache.py"
          )

          for test_case in "${test_cases[@]}"; do
            if [ ! -f "${sglang_source_path}/${test_case}" ]; then
              echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
              exit 1
            fi
          done

          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

          echo "scaling_governor performance num: \
            $(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | grep performance | wc -l)"
          echo "swappiness: $(cat /proc/sys/vm/swappiness)"
          echo "numa_balancing: $(cat /proc/sys/kernel/numa_balancing)"
          echo "sched_migration_cost_ns: $(cat /proc/sys/kernel/sched_migration_cost_ns)"

          export SGLANG_TEST_MAX_RETRY=0
          export SGLANG_SET_CPU_AFFINITY=1
          echo "SGLANG_SET_CPU_AFFINITY: $SGLANG_SET_CPU_AFFINITY"

          echo "Use sglang from image"
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r ${sglang_source_path}/python/sglang/test/ascend ${ascend_test_util_path}

          # Set environment of cann
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true

          current_date=$(date +%Y%m%d)
          log_path="/root/.cache/tests/logs/log/${current_date}/${HOSTNAME}"
          rm -rf ${log_path}
          mkdir -p ${log_path}
          echo "Log path: ${log_path}"

          # Run all test cases sequentially; a failure does not abort the
          # remaining cases. Each result is recorded and the final summary
          # determines the job's exit status.
          failed_cases=()
          for test_case in "${test_cases[@]}"; do
            tc_name=$(basename ${test_case} .py)
            echo "========== Running test case: ${test_case} =========="
            if python -u ${sglang_source_path}/${test_case}; then
              echo "PASSED: ${test_case}"
            else
              echo "FAILED: ${test_case}"
              failed_cases+=("${test_case}")
            fi
            echo "Finished test case ${test_case}"
          done

          echo "========== Test Summary =========="
          total=${#test_cases[@]}
          failed=${#failed_cases[@]}
          passed=$((total - failed))
          echo "Total: ${total}, Passed: ${passed}, Failed: ${failed}"
          if [ ${failed} -gt 0 ]; then
            echo "Failed cases:"
            for fc in "${failed_cases[@]}"; do
              echo "  - ${fc}"
            done
            exit 1
          fi

          plog_path="/root/ascend/log/debug/plog"
          if [ -d "$plog_path" ];then
            echo "Plog files found. Begin to backup them."
            target_plog_path="/root/.cache/tests/logs/plog/${HOSTNAME}"
            echo "Save path: ${target_plog_path}"
            rm -rf ${target_plog_path}
            mkdir -p ${target_plog_path}
            cp ${plog_path}/* ${target_plog_path}
          fi
