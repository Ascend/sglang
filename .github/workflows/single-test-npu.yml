name: Single Test (NPU)
# Qwen3-235B W8A8 on one A3 node (16 NPUs), with sgl-project/sglang#40814.

on:
  pull_request:
    branches:
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/single-test-npu.yml"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-node-poc:
    name: single-node-poc
    runs-on: linux-aarch64-a3-16-
    strategy:
      fail-fast: false
      matrix:
        image_tag: [ main-cann9.0.0-a3 ]
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:${{ matrix.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply sgl-project/sglang PR 40814 to the image runtime
        shell: bash
        run: |
          set -euo pipefail
          sglang_repo=/sgl-workspace/sglang
          export PYTHONPATH="${sglang_repo}/python${PYTHONPATH:+:${PYTHONPATH}}"
          echo "PYTHONPATH=${PYTHONPATH}" >> "$GITHUB_ENV"

          # Change from e98ffc4cc699d7953f17e751ce669043a7e17bcb (PR #40814).
          # Patch the image runtime, retaining its CANN/PyTorch/kernel dependencies.
          patch_file="${RUNNER_TEMP}/sglang-pr40814.patch"
          cat > "$patch_file" <<'PATCH'
          diff --git a/python/sglang/srt/hardware_backend/npu/graph_runner/npu_cudagraph_backend.py b/python/sglang/srt/hardware_backend/npu/graph_runner/npu_cudagraph_backend.py
          --- a/python/sglang/srt/hardware_backend/npu/graph_runner/npu_cudagraph_backend.py
          +++ b/python/sglang/srt/hardware_backend/npu/graph_runner/npu_cudagraph_backend.py
          @@ -178,6 +178,6 @@ def replay_with_input_update(
                   update_future = self._update_executor.submit(
                       graph.update, cpu_update_input=cpu_update_input
                   )
          -        update_future.result()
                   graph.replay()
          +        update_future.result()
                   return self._outputs[shape_key]
          PATCH

          cd "$sglang_repo"
          if git -c safe.directory="$sglang_repo" apply --check "$patch_file"; then
            git -c safe.directory="$sglang_repo" apply "$patch_file"
            echo "Applied sgl-project/sglang#40814 to the image runtime."
          elif git -c safe.directory="$sglang_repo" apply --reverse --check "$patch_file"; then
            echo "The image runtime already contains sgl-project/sglang#40814."
          else
            echo "::error::PR 40814 cannot be applied or verified in the image runtime."
            exit 1
          fi

          python - <<'PY'
          import ast
          from pathlib import Path

          import sglang

          package = Path(sglang.__file__).resolve().parent
          expected = Path("/sgl-workspace/sglang/python/sglang").resolve()
          if package != expected:
              raise RuntimeError(f"Unexpected SGLang runtime: {package}")
          backend = package / "srt/hardware_backend/npu/graph_runner/npu_cudagraph_backend.py"
          tree = ast.parse(backend.read_text())
          cls = next(node for node in tree.body if isinstance(node, ast.ClassDef)
                     and node.name == "NPUCudaGraphBackend")
          method = next(node for node in cls.body if isinstance(node, ast.FunctionDef)
                        and node.name == "replay_with_input_update")
          calls = [ast.unparse(node.value) for node in method.body
                   if isinstance(node, ast.Expr)]
          if calls.index("graph.replay()") >= calls.index("update_future.result()"):
              raise RuntimeError("PR 40814 replay ordering is missing")
          print(f"Verified PR 40814 in the imported SGLang runtime: {backend}")
          PY

      - name: Check npu info
        run: |
          npu-smi info

      - name: Run test
        timeout-minutes: 300
        env:
          SGLANG_USE_MODELSCOPE: true
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_IS_IN_CI: true
        shell: bash
        run: |
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          ln -sf ${sglang_source_path} /root/sglang

          # Test cases - 使用时替换为实际的测试用例路径
          test_cases=(
            "test/registered/npu/performance/qwen3_235b_a22b/test_npu_qwen3_235b_w8a8_8p_in3k5_out1k5_50ms.py",
            "test/registered/npu/basic_function/mambacache/test_npu_qwen3_next_models_mtp.py"
          )

          for test_case in "${test_cases[@]}"; do
            if [ ! -f "${sglang_source_path}/${test_case}" ]; then
              echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
              exit 1
            fi
          done

          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

          echo "scaling_governor performance num: \
            $(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | grep performance | wc -l)"
          echo "swappiness: $(cat /proc/sys/vm/swappiness)"
          echo "numa_balancing: $(cat /proc/sys/kernel/numa_balancing)"
          echo "sched_migration_cost_ns: $(cat /proc/sys/kernel/sched_migration_cost_ns)"

          export SGLANG_TEST_MAX_RETRY=0
          export SGLANG_SET_CPU_AFFINITY=1
          echo "SGLANG_SET_CPU_AFFINITY: $SGLANG_SET_CPU_AFFINITY"

          echo "Use sglang from image with PR 40814"
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r ${sglang_source_path}/python/sglang/test/ascend ${ascend_test_util_path}

          # Set environment of cann
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true

          current_date=$(date +%Y%m%d)
          log_path="/root/.cache/tests/logs/log/${current_date}/${HOSTNAME}"
          rm -rf ${log_path}
          mkdir -p ${log_path}
          echo "Log path: ${log_path}"

          for test_case in "${test_cases[@]}"; do
            tc_name=$(basename ${test_case} .py)
            echo "Running test case ${test_case}"
            python -u "${sglang_source_path}/${test_case}" 2>&1 | tee /tmp/test_output.log
            echo "Finished test case ${test_case}"
          done

          plog_path="/root/ascend/log/debug/plog"
          if [ -d "$plog_path" ];then
            echo "Plog files found. Begin to backup them."
            target_plog_path="/root/.cache/tests/logs/plog/${HOSTNAME}"
            echo "Save path: ${target_plog_path}"
            rm -rf ${target_plog_path}
            mkdir -p ${target_plog_path}
            cp ${plog_path}/* ${target_plog_path}
          fi
