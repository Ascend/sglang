name: Single Test (NPU)
# test round 1: test_npu_basic_sanity.py - 验证 hellaswag 数据预加载修复。
#   背景: rowanz/hellaswag 于 2026-09-14 被 GitHub DMCA 下架 (wikihow), test_programs.py
#   中硬编码的 raw URL 404, full-test 的 test_npu_basic_sanity.py test_accuracy_floor
#   报 requests.exceptions.HTTPError: 404 (run 37605365300, job 112739451597, PR #1292)。
#   PR #1292 已在 _npu-pr-test-stage.yml 加了 HF Rowan/hellaswag 预加载, 但其内联
#   `python3 -c "<多行>"` 被 YAML run 块缩进污染, IndentationError 静默失败
#   (log: "File <string> line 2 import json IndentationError")。
#   本轮验证: 用修复后的 heredoc 版预加载生成 /tmp/hellaswag_val.jsonl (fail-fast),
#   再跑 test_npu_basic_sanity.py 全链路, 证明预加载代码与数据 schema 可用。
#   B083 镜像 a3-8 池 ImagePullBackOff 持续 (PR #1301 run 38041063456 等), 用 a3-16 绕行
#   (用例单卡即可); 注意 SWR 域名是 swr.cn-southwest-2 (PR #1301 误写为 south-west 连字符
#   版本导致 run 38041689363 Initialize containers 失败)。

on:
  pull_request:
    branches:
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/single-test-npu.yml"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-node-poc:
    name: single-node-poc
    runs-on: linux-aarch64-a3-16
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-B083
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check npu info
        run: |
          npu-smi info

      - name: Run test
        timeout-minutes: 180
        env:
          SGLANG_USE_MODELSCOPE: true
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_IS_IN_CI: true
        shell: bash
        run: |
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          ln -sf ${sglang_source_path} /root/sglang

          # Test cases - 使用时替换为实际的测试用例路径
          test_cases=(
            "test/registered/npu/basic_function/speculative_inference/test_npu_basic_sanity.py"
          )

          for test_case in "${test_cases[@]}"; do
            if [ ! -f "${sglang_source_path}/${test_case}" ]; then
              echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
              exit 1
            fi
          done

          pip install websocket-client websockets uvicorn==0.49.0
          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

          echo "Use sglang from image"
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r ${sglang_source_path}/python/sglang/test/ascend ${ascend_test_util_path}
          # Overlay test kits + test_programs.py from the PR checkout (image
          # snapshots may predate kits/ and test_hellaswag_select), same as
          # the full-test install step in _npu-pr-test-stage.yml.
          rm -rf ${sglang_pkg_path}/sglang/test/kits
          cp -r ${sglang_source_path}/python/sglang/test/kits ${sglang_pkg_path}/sglang/test/
          cp ${sglang_source_path}/python/sglang/test/test_programs.py ${sglang_pkg_path}/sglang/test/test_programs.py

          # Preload hellaswag (fix under test, heredoc version). Fail-fast here:
          # this round exists to prove the preload code works end to end.
          # Heredoc body lines stay at the base indent of this run block so they
          # start at column 0 in the shell script (YAML strips the block indent).
          python3 - <<'PYEOF' || { echo "ERROR: hellaswag preload failed"; exit 1; }
          import json
          from datasets import load_dataset
          ds = load_dataset('Rowan/hellaswag', split='validation')
          with open('/tmp/hellaswag_val.jsonl', 'w') as f:
              for row in ds:
                  row['label'] = int(row['label'])
                  f.write(json.dumps(row) + '\n')
          print(f'preloaded {len(ds)} hellaswag examples to /tmp/hellaswag_val.jsonl')
          PYEOF
          wc -l /tmp/hellaswag_val.jsonl

          export SGLANG_TEST_MAX_RETRY=0
          export SGLANG_SET_CPU_AFFINITY=1
          echo "SGLANG_SET_CPU_AFFINITY: $SGLANG_SET_CPU_AFFINITY"

          # Set environment of cann
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true

          current_date=$(date +%Y%m%d)
          log_path="/root/.cache/tests/logs/log/${current_date}/${HOSTNAME}"
          rm -rf ${log_path}
          mkdir -p ${log_path}
          echo "Log path: ${log_path}"

          for test_case in "${test_cases[@]}"; do
            tc_name=$(basename ${test_case} .py)
            echo "Running test case ${test_case}"
            python -u ${sglang_source_path}/${test_case}
            echo "Finished test case ${test_case}"
          done

          plog_path="/root/ascend/log/debug/plog"
          if [ -d "$plog_path" ];then
            echo "Plog files found. Begin to backup them."
            target_plog_path="/root/.cache/tests/logs/plog/${HOSTNAME}"
            echo "Save path: ${target_plog_path}"
            rm -rf ${target_plog_path}
            mkdir -p ${target_plog_path}
            cp ${plog_path}/* ${target_plog_path}
          fi
