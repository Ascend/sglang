name: Single Test (NPU)

on:
  pull_request:
    branches:
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/single-test-npu.yml"
      - "scripts/ci/npu_vlm_diagnostics/**"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  single-node-poc:
    name: VLM input format diagnostics
    runs-on: linux-aarch64-a3-2
    timeout-minutes: 75
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-B100
    env:
      SGLANG_USE_MODELSCOPE: "true"
      HF_ENDPOINT: https://hf-mirror.com
      SGLANG_IS_IN_CI: "true"
      SGLANG_TEST_MAX_RETRY: "0"
      SGLANG_SET_CPU_AFFINITY: "1"
      VLM_DIAGNOSTICS_TENSOR_SCOPE: qkv
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare original test helpers and machine evidence
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/npu-vlm/machine
          ln -sf "$GITHUB_WORKSPACE" /root/sglang
          helper_path=/sgl-workspace/sglang/python/sglang/test/ascend
          if [ -d "$helper_path" ]; then
            mv "$helper_path" "${helper_path}_vlm_original"
          fi
          cp -r "$GITHUB_WORKSPACE/python/sglang/test/ascend" "$helper_path"
          git rev-parse HEAD > artifacts/npu-vlm/machine/checkout-sha.txt
          git -C /sgl-workspace/sglang rev-parse HEAD > artifacts/npu-vlm/machine/image-sha.txt
          hostname > artifacts/npu-vlm/machine/hostname.txt
          uname -a > artifacts/npu-vlm/machine/uname.txt
          npu-smi info > artifacts/npu-vlm/machine/npu-before.txt 2>&1 || true
          for info_file in \
            /usr/local/Ascend/driver/version.info \
            /usr/local/Ascend/firmware/version.info \
            /usr/local/Ascend/cann/arm64-linux/ascend_toolkit_install.info \
            /usr/local/Ascend/cann/opp/version.info; do
            if [ -f "$info_file" ]; then
              cat "$info_file" > "artifacts/npu-vlm/machine/${info_file//\//_}"
            fi
          done
          printf '%s\n' "$RUNNER_NAME" > artifacts/npu-vlm/machine/runner.txt
          printf '%s\n' 'cann9.1.0-a3-B100' > artifacts/npu-vlm/machine/image-tag.txt

      - name: Fingerprint the installed NPU computation stack
        shell: bash
        run: |
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          python scripts/ci/npu_vlm_diagnostics/hooks/npu_vlm_fingerprint.py \
            --output artifacts/npu-vlm/machine/binary-fingerprint.json

      - name: Independent Qwen baseline without internal diagnostic hooks
        id: baseline
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          mkdir -p artifacts/npu-vlm/baseline
          timeout --kill-after=30s 600s python -u scripts/ci/npu_vlm_diagnostics/run_case.py \
            test/registered/npu/vlm_models/test_npu_vlm_input_format.py \
            --mode qwen --output-dir artifacts/npu-vlm/baseline \
            2>&1 | tee artifacts/npu-vlm/baseline/console.log

      - name: Independent Qwen raw image with diagnostics
        id: qwen
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          export VLM_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/artifacts/npu-vlm/qwen/snapshots"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/ci/npu_vlm_diagnostics/hooks:${PYTHONPATH:-}"
          mkdir -p artifacts/npu-vlm/qwen
          timeout --kill-after=30s 600s python -u scripts/ci/npu_vlm_diagnostics/run_case.py \
            test/registered/npu/vlm_models/test_npu_vlm_input_format.py \
            --mode qwen --output-dir artifacts/npu-vlm/qwen \
            2>&1 | tee artifacts/npu-vlm/qwen/console.log

      - name: Replay captured raw vision output through precomputed input
        id: replay
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          export VLM_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/artifacts/npu-vlm/replay/snapshots"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/ci/npu_vlm_diagnostics/hooks:${PYTHONPATH:-}"
          mkdir -p artifacts/npu-vlm/replay
          timeout --kill-after=30s 600s python -u scripts/ci/npu_vlm_diagnostics/replay_embeddings.py \
            test/registered/npu/vlm_models/test_npu_vlm_input_format.py \
            --source-dir artifacts/npu-vlm/qwen --output-dir artifacts/npu-vlm/replay \
            2>&1 | tee artifacts/npu-vlm/replay/console.log

      - name: Fixed CI vision with BF16 and 20-40 process core limits
        id: core_replay
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          export VLM_DEVICE_LIMIT_CUBE=20
          export VLM_DEVICE_LIMIT_VECTOR=40
          export VLM_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/artifacts/npu-vlm/core-replay/snapshots"
          export VLM_GATE_UP_PROBE=1
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/ci/npu_vlm_diagnostics/hooks:${PYTHONPATH:-}"
          mkdir -p artifacts/npu-vlm/core-replay
          timeout --kill-after=30s 600s python -u scripts/ci/npu_vlm_diagnostics/replay_embeddings.py \
            test/registered/npu/vlm_models/test_npu_vlm_input_format.py \
            --source-dir artifacts/npu-vlm/qwen --output-dir artifacts/npu-vlm/core-replay \
            2>&1 | tee artifacts/npu-vlm/core-replay/console.log

      - name: Replay frozen prefill gate-up at 20-40 resources
        id: gate_up_replay
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -eo pipefail
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          set -u
          mkdir -p artifacts/npu-vlm/gate-up-20-40
          python - <<'INNER'
          from pathlib import Path
          from modelscope import snapshot_download
          model = Path("/root/.cache/modelscope/hub/models/Qwen/Qwen2.5-VL-3B-Instruct")
          if not (model / "model.safetensors.index.json").exists():
              model = Path(snapshot_download("Qwen/Qwen2.5-VL-3B-Instruct"))
          Path("artifacts/npu-vlm/gate-up-20-40/model-path.txt").write_text(str(model))
          INNER
          model_path=$(cat artifacts/npu-vlm/gate-up-20-40/model-path.txt)
          ASCEND_GLOBAL_LOG_LEVEL=0 python -u scripts/ci/npu_vlm_diagnostics/replay_gate_up.py \
            --source artifacts/npu-vlm/core-replay/snapshots --model "$model_path" \
            --output artifacts/npu-vlm/gate-up-20-40 \
            --cube-num 20 --vector-num 40 --profile --require-match \
            2>&1 | tee artifacts/npu-vlm/gate-up-20-40/console.log

      - name: Export exact gate-up replay inputs and profiled kernels
        id: export_gate_up
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          python - <<'INNER'
          import csv
          import json
          import re
          import shutil
          from pathlib import Path
          source = Path("artifacts/npu-vlm/core-replay/snapshots")
          target = Path("artifacts/npu-vlm/gate-up-frozen/snapshots")
          target.mkdir(parents=True, exist_ok=True)
          counts = {}
          stages = {"gate_up.operator.input", "gate_up.operator.output", "decoder.loaded_weights", "runtime.fingerprint"}
          for path in sorted(source.glob("*.json")):
              record = json.loads(path.read_text())
              stage = record["stage"]
              if stage not in stages:
                  continue
              key = (stage, record["rank"])
              counts[key] = counts.get(key, 0) + 1
              shutil.copy2(path, target / path.name)
              if record.get("tensor_file"):
                  name = record["tensor_file"]
                  shutil.copy2(path.parent / name, target / name)
          expected = {(stage, rank) for stage in stages for rank in (0, 1)}
          assert set(counts) == expected and all(v == 1 for v in counts.values()), counts
          (target.parent / "coverage.json").write_text(json.dumps([
              {"stage": stage, "rank": rank, "records": count}
              for (stage, rank), count in sorted(counts.items())], indent=2))
          runtime_file = Path("artifacts/npu-vlm/gate-up-20-40/runtime.json")
          if runtime_file.exists():
              pid = str(json.loads(runtime_file.read_text())["pid"])
              plog_output = Path("artifacts/npu-vlm/gate-up-20-40/plog")
              plog_output.mkdir(exist_ok=True)
              files = []
              for path in Path("/root/ascend/log").glob("*/plog/*"):
                  if path.is_file() and re.search(rf"(?:^|[-_]){pid}(?:[-_.]|$)", path.name):
                      name = path.parent.parent.name + "-" + path.name
                      shutil.copy2(path, plog_output / name)
                      files.append({"file": name, "bytes": path.stat().st_size})
              coverage = {"pid": pid, "matched_files": files, "available": bool(files)}
              (plog_output / "coverage.json").write_text(json.dumps(coverage, indent=2))
              print("VLM_GATE_UP_PLOG", json.dumps(coverage))
          for path in sorted(Path("artifacts/npu-vlm/gate-up-20-40").rglob("kernel_details.csv")):
              for row in csv.DictReader(path.open()):
                  print("VLM_PROFILE_KERNEL", json.dumps({"file": str(path), "row": row}))
          INNER

      - name: Upload gate-up cross-machine inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-vlm-gate-up-${{ github.run_id }}
          path: |
            artifacts/npu-vlm/gate-up-frozen
            artifacts/npu-vlm/gate-up-20-40
          retention-days: 14
          if-no-files-found: error

      - name: Original Qwen raw image with BF16 and 20-40 process core limits
        id: core_raw
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          export VLM_DEVICE_LIMIT_CUBE=20
          export VLM_DEVICE_LIMIT_VECTOR=40
          export VLM_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/artifacts/npu-vlm/core-raw/snapshots"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/ci/npu_vlm_diagnostics/hooks:${PYTHONPATH:-}"
          mkdir -p artifacts/npu-vlm/core-raw
          timeout --kill-after=30s 600s python -u scripts/ci/npu_vlm_diagnostics/run_case.py \
            test/registered/npu/vlm_models/test_npu_vlm_input_format.py \
            --mode qwen --output-dir artifacts/npu-vlm/core-raw \
            2>&1 | tee artifacts/npu-vlm/core-raw/console.log

      - name: Original Qwen raw image with native FP32 LM head
        id: fp32_head
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true
          export VLM_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/artifacts/npu-vlm/fp32-head/snapshots"
          export PYTHONPATH="$GITHUB_WORKSPACE/scripts/ci/npu_vlm_diagnostics/hooks:${PYTHONPATH:-}"
          mkdir -p artifacts/npu-vlm/fp32-head
          timeout --kill-after=30s 600s python -u scripts/ci/npu_vlm_diagnostics/run_case.py \
            test/registered/npu/vlm_models/test_npu_vlm_input_format.py \
            --mode qwen --enable-fp32-lm-head --output-dir artifacts/npu-vlm/fp32-head \
            2>&1 | tee artifacts/npu-vlm/fp32-head/console.log

      - name: Collect device and plog evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/npu-vlm/machine
          npu-smi info > artifacts/npu-vlm/machine/npu-after.txt 2>&1 || true
          if [ -d /root/ascend/log/debug/plog ]; then
            cp -r /root/ascend/log/debug/plog artifacts/npu-vlm/plog || true
          fi

      - name: Pack layer probes for replay
        id: pack_probes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import shutil
          import json
          import re
          failures = []
          for directory in Path("artifacts/npu-vlm").glob("*/layer-probes"):
              records = [json.loads(line) for path in directory.glob("*.jsonl")
                         for line in path.read_text().splitlines()]
              available = {(r["rank"], r["frame"]["index"], r["module"], r["direction"])
                           for r in records}
              weights = next(json.loads(path.read_text())["payload"]
                             for path in (directory.parent / "snapshots").glob("*.json")
                             if json.loads(path.read_text())["stage"] == "decoder.loaded_weights")
              layers = {int(re.search(r"model.layers.(\d+).", key).group(1))
                        for key in weights if key.startswith("model.layers.")}
              expected = {(rank, frame, f"layers.{layer}", direction)
                          for rank in (0, 1) for frame in range(4)
                          for layer in layers for direction in ("input", "output")}
              expected |= {(rank, frame, "final_norm", direction)
                           for rank in (0, 1) for frame in range(4)
                           for direction in ("input", "output")}
              missing = sorted(expected - available)
              (directory.parent / "layer-probe-coverage.json").write_text(
                  json.dumps({"records": len(records), "missing": missing}, indent=2))
              if missing:
                  failures.append(str(directory))
              target = directory.parent / "layer-probes.tar.gz"
              with tarfile.open(target, "w:gz") as archive:
                  archive.add(directory, arcname="layer-probes")
              shutil.rmtree(directory)
          if failures:
              raise RuntimeError(f"Incomplete layer probes: {failures}")
          PY

      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-vlm-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/npu-vlm
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve every failed phase in job status
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          QWEN_OUTCOME: ${{ steps.qwen.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          FP32_HEAD_OUTCOME: ${{ steps.fp32_head.outcome }}
          CORE_REPLAY_OUTCOME: ${{ steps.core_replay.outcome }}
          CORE_RAW_OUTCOME: ${{ steps.core_raw.outcome }}
          PACK_PROBES_OUTCOME: ${{ steps.pack_probes.outcome }}
          GATE_UP_REPLAY_OUTCOME: ${{ steps.gate_up_replay.outcome }}
          EXPORT_GATE_UP_OUTCOME: ${{ steps.export_gate_up.outcome }}
        shell: bash
        run: |
          printf 'prepare=%s baseline=%s qwen=%s replay=%s fp32_head=%s\n' \
            "$PREPARE_OUTCOME" "$BASELINE_OUTCOME" "$QWEN_OUTCOME" "$REPLAY_OUTCOME" "$FP32_HEAD_OUTCOME"
          [ "$PREPARE_OUTCOME" = success ] && [ "$BASELINE_OUTCOME" = success ] && \
            [ "$QWEN_OUTCOME" = success ] && [ "$REPLAY_OUTCOME" = success ] && \
            [ "$FP32_HEAD_OUTCOME" = success ] && [ "$PACK_PROBES_OUTCOME" = success ] && \
            [ "$CORE_REPLAY_OUTCOME" = success ] && [ "$CORE_RAW_OUTCOME" = success ] && \
            [ "$GATE_UP_REPLAY_OUTCOME" = success ] && [ "$EXPORT_GATE_UP_OUTCOME" = success ]
