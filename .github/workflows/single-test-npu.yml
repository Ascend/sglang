name: Single Test (NPU)
# test round 1: <测试用例描述>

on:
  pull_request:
    branches:
      - testcases
      - testcases-260813
    paths:
      - ".github/workflows/single-test-npu.yml"

concurrency:
  group: single-test-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-node-poc:
    name: single-node-poc
    runs-on: linux-aarch64-a3-2
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-B072
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check npu info
        run: |
          npu-smi info

      - name: Run test
        timeout-minutes: 120
        env:
          SGLANG_USE_MODELSCOPE: true
          HF_ENDPOINT: https://hf-mirror.com
          SGLANG_IS_IN_CI: true
        shell: bash
        run: |
          sglang_source_path=$(pwd)
          echo "Source code path: ${sglang_source_path}"
          ln -sf ${sglang_source_path} /root/sglang

          # Test cases - 使用时替换为实际的测试用例路径
          test_cases=(
            "test/registered/npu/basic_function/lora/test_npu_lora_backend.py"
            "test/registered/npu/basic_function/memory_and_scheduling/test_npu_retraction_policy.py"
            "test/registered/npu/basic_function/lora/test_npu_lora_overlap_loading.py"
            "test/registered/npu/basic_function/rl/test_npu_weight_checker_e2e.py"
            "test/registered/npu/basic_function/optimization_debug_options/test_npu_enable_mixed_chunk.py"
            "test/registered/npu/basic_function/Multi-Modal/test_npu_multimodal_moe_gdn.py"
            "test/registered/npu/basic_function/Multi-Modal/test_npu_multimodal_moe_multistream.py"
            "test/registered/npu/basic_function/Multi-Modal/test_npu_multimodal_reasoning_parser.py"
            "test/registered/npu/basic_function/Multi-Modal/test_npu_multimodal_quantization_chunked.py"
            "test/registered/npu/basic_function/Custom_weight_loader/test_npu_update_weights_from_tensor.py"
            "test/registered/npu/basic_function/Multi-Modal/test_npu_multimodal_moe_eplb.py"
            "test/registered/npu/basic_function/mambacache/test_npu_qwen3_next_models.py"
            "test/registered/npu/llm_models/test_npu_qwen3_30b_attn_cp.py"
            "test/registered/npu/llm_models/test_npu_qwen3_next_80b.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_enable_waterfill.py"
            "test/registered/npu/basic_function/forward/test_npu_enable_quant_communications.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_dispatcher_output_dtype.py"
            "test/registered/npu/basic_function/parallel_strategy/expert_parallelism/test_npu_deepep_low_latency_qwen3_next.py"
            "test/registered/npu/accuracy/qwen3_5_9b/test_npu_qwen3_5_9b_bf16_1p_gsm8k.py"
            "test/registered/npu/accuracy/minimax_m2_5/test_npu_minimax_m2_5_w8a8_4p_in64k_out1k_prefix90_50ms_gpqa.py"
            "test/registered/npu/accuracy/minimax_m2_5/test_npu_minimax_m2_5_w8a8_8p_in3k5_out1k5_50ms_gpqa.py"
            "test/registered/npu/performance/qwen3_5_397b/test_npu_qwen3_5_397b_w4a8_8p_in128k_out1k_50ms.py"
            "test/registered/npu/performance/qwen3_5_397b/test_npu_qwen3_5_397b_w4a8_8p_in3k5_out1k5_20ms.py"
            "test/registered/npu/performance/qwen3_5_397b/test_npu_qwen3_5_397b_w4a8_8p_in128k_out1k_20ms.py"
            "test/registered/npu/performance/qwen3_5_397b/test_npu_qwen3_5_397b_w4a8_8p_in16k_out1k_20ms.py"
            "test/registered/npu/performance/qwen3_5_397b/test_npu_qwen3_5_397b_w4a8_8p_in16k_out1k_50ms.py"
            #"test/registered/npu/llm_models/test_npu_deepseek_v3_2_w8a8.py"
          )

          for test_case in "${test_cases[@]}"; do
            if [ ! -f "${sglang_source_path}/${test_case}" ]; then
              echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
              exit 1
            fi
          done

          # copy required file from our daily cache
          cp ~/.cache/modelscope/hub/datasets/otavia/ShareGPT_Vicuna_unfiltered/ShareGPT_V3_unfiltered_cleaned_split.json /tmp
          cp ~/.cache/modelscope/hub/datasets/tmp/test.jsonl /tmp

          echo "scaling_governor performance num: \
            $(cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | grep performance | wc -l)"
          echo "swappiness: $(cat /proc/sys/vm/swappiness)"
          echo "numa_balancing: $(cat /proc/sys/kernel/numa_balancing)"
          echo "sched_migration_cost_ns: $(cat /proc/sys/kernel/sched_migration_cost_ns)"

          export SGLANG_TEST_MAX_RETRY=0
          export SGLANG_SET_CPU_AFFINITY=1
          echo "SGLANG_SET_CPU_AFFINITY: $SGLANG_SET_CPU_AFFINITY"

          echo "Use sglang from image"
          sglang_pkg_path=/sgl-workspace/sglang/python
          ascend_test_util_path=${sglang_pkg_path}/sglang/test/ascend
          mkdir -p ${ascend_test_util_path}
          mv ${ascend_test_util_path} ${ascend_test_util_path}_bak
          cp -r ${sglang_source_path}/python/sglang/test/ascend ${ascend_test_util_path}

          # Set environment of cann
          source /usr/local/Ascend/cann/set_env.sh || true
          source /usr/local/Ascend/nnal/atb/set_env.sh || true

          current_date=$(date +%Y%m%d)
          log_path="/root/.cache/tests/logs/log/${current_date}/${HOSTNAME}"
          rm -rf ${log_path}
          mkdir -p ${log_path}
          echo "Log path: ${log_path}"

          for test_case in "${test_cases[@]}"; do
            tc_name=$(basename ${test_case} .py)
            echo "Running test case ${test_case}"
            python -u ${sglang_source_path}/${test_case}
            echo "Finished test case ${test_case}"
          done

          plog_path="/root/ascend/log/debug/plog"
          if [ -d "$plog_path" ];then
            echo "Plog files found. Begin to backup them."
            target_plog_path="/root/.cache/tests/logs/plog/${HOSTNAME}"
            echo "Save path: ${target_plog_path}"
            rm -rf ${target_plog_path}
            mkdir -p ${target_plog_path}
            cp ${plog_path}/* ${target_plog_path}
          fi
