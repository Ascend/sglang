name: 'Nightly Test (NPU) Single Node Template'

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: linux-aarch64-a3-4
      test_type:
        required: false
        type: string
        default: perf
        description: perf or accuracy
      test_config_name:
        required: true
        type: string
        description: test config name
      test_case:
        required: true
        type: string
        description: path of test case file
      image:
        required: false
        type: string
        description: image for pods
        default: "swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:cann9.1.0-a3-20260820"
      install_sglang_from_source:
        required: false
        type: boolean
        default: true
        description: use sglang from source code or from docker image
      transformers_version:
        required: false
        type: string
        default: ""
        description: "The transformers version number for running sglang. Use default version in image if keep empty."

concurrency:
  group: ascend-nightly-single-node-${{ github.workflow_ref }}-${{ github.ref }}-${{ inputs.test_config_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ inputs.test_config_name }}
    runs-on: ${{ inputs.runner }}
    container:
      image: swr.ap-southeast-1.myhuaweicloud.com/base_image/ascend-ci/sglang:main-x86
      env:
        KUBECONFIG: /root/.cache/.cache/kb.yaml
        KUBECTL: /root/.cache/.cache/kubectl
        NAMESPACE: sgl-project
        KUBE_JOB_NAME: ascend-sglang-${{ inputs.test_type }}-test
        SGLANG_IS_IN_CI: true
        ASCEND_E2E_TEST_CONFIG_PATH: python/sglang/test/ascend/e2e
        SGLANG_USE_MODELSCOPE: true
        HF_ENDPOINT: https://hf-mirror.com
        TRANSFORMERS_VERBOSITY: "error"
        GDN_ATTN_BACKEND_TRITON: 1
    steps:
      - name: Install dependencies
        run: |
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple jinja2
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple psutil
          # Install kubernetes
          pip3 install -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple kubernetes
          cp $KUBECTL /usr/local/sbin/

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare code for testing
        run: |
          # copy source code to shared-disk
          # Append run_id to isolate concurrent runs sharing the same PVC.
          current_path=$(pwd)
          target_path=/root/.cache/tests/sglang-${{ github.run_id }}
          rm -rf ${target_path}
          mkdir -p ${target_path}
          cp -r ${current_path}/* ${target_path}/

      - name: Clear resources
        run: |
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          kubectl delete -f ./k8s_single_*.yaml --ignore-not-found=true || true

          pod_name_prefix="${KUBE_JOB_NAME}-"
          echo "kube name space: $NAMESPACE, pod name prefix: ${pod_name_prefix}"
          max_retries=60
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if kubectl get pods -n $NAMESPACE | grep -q "${pod_name_prefix}"; then
              echo "Found stale sglang pods, retry $((retry_count+1))/${max_retries} (sleeping 30s)..."
              sleep 30
              kubectl get pods -n $NAMESPACE | grep "${pod_name_prefix}" | awk '{print $1}' | while read -r pod_name; do
                [ -z "$pod_name" ] && continue
                if kubectl delete pod "$pod_name" -n $NAMESPACE --force --ignore-not-found=true; then
                  echo "  $pod_name: SUCCESS"
                else
                  echo "  $pod_name: WARNING (delete failed)"
                fi
              done
              retry_count=$((retry_count+1))
            else
              echo "No stale sglang pods found, start test case..."
              break
            fi
          done
          if [ $retry_count -ge $max_retries ]; then
            echo "ERROR: pre-test cleanup timeout after $((max_retries*30))s, some pods still remain"
            exit 1
          fi

      - name: Run test
        timeout-minutes: 300
        run: |
          # sglang_source_relative_path is shared-disk path
          # Append run_id so concurrent runs do not overwrite each other on the shared PVC.
          sglang_source_relative_path=tests/sglang-${{ github.run_id }}
          sglang_source_path=/root/.cache/${sglang_source_relative_path}
          echo "Source code path: ${sglang_source_path}"

          test_case="${{ inputs.test_case }}"
          if [ ! -f "${sglang_source_path}/${test_case}" ]; then
            echo "The testcase does not exit: ${sglang_source_path}/${test_case}"
            exit 1
          fi

          # prepare for output data
          tc_name=${test_case##*/}
          tc_name=${tc_name%.*}

          sglang_test_results_output_path=/root/.cache/tests/output/${{ inputs.test_type }}/${tc_name}
          mkdir -p ${sglang_test_results_output_path}
          echo "Metrics file path: ${sglang_test_results_output_path}"

          transformers_version="${{ inputs.transformers_version }}"
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          CMD="python3 -u run_npu_e2e_test.py \
            --env ci \
            --image ${{ inputs.image }} \
            --sglang-source-relative-path ${sglang_source_relative_path} \
            --metrics-data-file ${sglang_test_results_output_path} \
            --test-case ${test_case} \
            --kube-name-space ${NAMESPACE} \
            --kube-job-type single \
            --kube-job-name-prefix ${KUBE_JOB_NAME} \
            --run-id ${{ github.run_id }}"

          if [ "$SGLANG_IS_IN_CI" = "true" ] || [ "$SGLANG_IS_IN_CI" = "True" ];then
            echo "Run test in ci."
            CMD="${CMD} --sglang-is-in-ci"
          fi

          install_sglang_from_source="${{ inputs.install_sglang_from_source }}"
          if [ "$install_sglang_from_source" = "true" ] || [ "$install_sglang_from_source" = "True" ];then
            echo "Install sglang from source."
            CMD="${CMD} --install-sglang-from-source"
            commit_id=${{ github.sha }}
            echo "commit id: ${commit_id}" > "$(dirname "${sglang_test_results_output_path}")/commit_id"
          else
            echo "Use sglang from image: ${{ inputs.image }}"
          fi

          if [ "$transformers_version" != "" ];then
            CMD="${CMD} --transformers-version ${transformers_version}"
          else
            echo "Use default transformers version in image."
          fi

          echo "Run command: ${CMD}"
          eval "${CMD}"

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ inputs.test_config_name }}
          path: /tmp/metrics.json
          retention-days: 7

      - name: Post process
        if: always()
        run: |
          cd ${ASCEND_E2E_TEST_CONFIG_PATH}
          kubectl get pods -n $NAMESPACE | grep $KUBE_JOB_NAME || true
          kubectl delete -f ./k8s_single_*.yaml --ignore-not-found=true || true

          # Prefer the exact job name (run_id-scoped random_str) written by the Python
          # script so we only delete pods belonging to this run, not other concurrent runs.
          if [ -f /tmp/kube_job_name.txt ]; then
            pod_name_prefix=$(cat /tmp/kube_job_name.txt)
            echo "Post-test cleanup using exact job name: ${pod_name_prefix}"
          else
            pod_name_prefix="${KUBE_JOB_NAME}-"
            echo "WARNING: /tmp/kube_job_name.txt not found, falling back to fixed prefix: ${pod_name_prefix}"
          fi
          echo "kube name space: $NAMESPACE, pod name prefix: ${pod_name_prefix}"
          max_retries=60
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if kubectl get pods -n $NAMESPACE | grep -q "${pod_name_prefix}"; then
              echo "Found remaining sglang pods, retry $((retry_count+1))/${max_retries} (sleeping 30s)..."
              sleep 30
              kubectl get pods -n $NAMESPACE | grep "${pod_name_prefix}" | awk '{print $1}' | while read -r pod_name; do
                [ -z "$pod_name" ] && continue
                if kubectl delete pod "$pod_name" -n $NAMESPACE --force --ignore-not-found=true; then
                  echo "  $pod_name: SUCCESS"
                else
                  echo "  $pod_name: WARNING (delete failed)"
                fi
              done
              retry_count=$((retry_count+1))
            else
              echo "No sglang pods remain."
              break
            fi
          done
          if [ $retry_count -ge $max_retries ]; then
            echo "WARNING: post-test cleanup timeout after $((max_retries*30))s, some pods may remain"
          fi

          # Cleanup the run-scoped source code directory on the shared PVC.
          rm -rf /root/.cache/tests/sglang-${{ github.run_id }} || true