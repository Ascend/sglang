name: Qwen3.6 27B NPU Source Commit Test

on:
  pull_request:
    branches:
      - testcases
    paths:
      - ".github/workflows/nightly-test-npu.yml"
      - ".github/workflows/nightly-test-npu-e2e-single-node.yml"
      - "python/**"
      - "test/registered/npu/performance/qwen3_6_27b/test_npu_qwen3_6_27b_w8a8_1p_in3k5_out1k5_50ms.py"
  workflow_dispatch:

concurrency:
  group: qwen3-6-27b-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qwen3-6-27b-source:
    name: qwen3_6_27b_w8a8_1p_in3k5_out1k5_50ms
    uses: ./.github/workflows/nightly-test-npu-e2e-single-node.yml
    with:
      runner: linux-aarch64-a3-2
      test_type: perf
      test_config_name: qwen3_6_27b_w8a8_1p_in3k5_out1k5_50ms
      test_case: test/registered/npu/performance/qwen3_6_27b/test_npu_qwen3_6_27b_w8a8_1p_in3k5_out1k5_50ms.py
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:main-cann9.0.0-a3
      install_sglang_from_source: true
      transformers_version: ''
